tdd_plan:
  required: true
  exception: null
  red:
    command: pnpm exec vitest run packages/editor/tests/package/single-package-distribution.test.ts
    expected_failure: public tellplot package and one-package release contract do not exist
  green:
    command: pnpm test:package && pnpm test:framework-matrix
    expected_signal: all public subpaths and four host consumers pass from one tarball
  refactor:
    command: pnpm release:check
    expected_signal: all stable release gates pass under Node 22.20.0
validation_loop:
  commands: [pnpm release:check, pnpm release:artifact, pnpm release:preflight, pnpm release:trust-readiness, python3 $HOME/.codex/skills/ai-delivery-governor/scripts/validate_delivery_artifacts.py --root . --feature-id 013-single-package-distribution --strict, git diff --check]
  retry_budget: 2
  failure_policy:
    first_failure: diagnose and fix a T131-scoped issue
    second_failure: classify code, browser host, registry, identity or authorization blocker
    beyond_budget: stop and record blocked evidence
evidence_contract:
  summary: .ai-platform/evidence/T131/summary.md
  diff: .ai-platform/evidence/T131/diff.patch
  test_results: .ai-platform/evidence/T131/test-results.md
  required: [changed files, RED and GREEN results, complete validation matrix, staged artifact, public registry verification]
review_contract:
  required_passes: [spec_compliance, bug_code_quality, qa_acceptance, release_artifact]
  acceptance_rule: goal completes only after public fresh install and provenance verification
handoff:
  external_issue: null
  pull_request: null
  finish_options: [publish tellplot 1.0.0 and record final evidence]
stop_conditions: [indeterminate registry state, tag lease drift, failed quality gate, staged hash mismatch, unavailable 2FA]
