    - No remote Git, publish, release or deployment.
    - No any, @ts-ignore or @ts-expect-error.

tdd_plan:
  red:
    - Lock runtime exports to ChartEditor and validateChartConfig.
    - Add type consumers for discriminated ChartConfig and renamed public types.
    - Add runtime validator and invalid component cases.
    - Add playground config/view parser and synchronization cases.
  green:
    - Implement closed public config types and validator.
    - Implement ChartEditor facade over the existing internal component.
    - Map semantic appearance/editor options without changing runtime ownership.
    - Replace private playground document with public config and view files.
  refactor:
    - Update docs and examples to the same public contract.
    - Remove stale public FinancialChart names from package entry and consumer surfaces.

validation_commands:
  - pnpm format:check
  - pnpm lint
  - pnpm typecheck
  - pnpm test:unit
  - pnpm test:coverage
  - pnpm build
  - pnpm test:package
  - pnpm test:react-matrix
  - pnpm test:e2e
  - pnpm test:a11y
  - pnpm test:performance
  - pnpm test:browser-previous
  - python3 $HOME/.codex/skills/ai-delivery-governor/scripts/validate_delivery_artifacts.py --root . --feature-id 009-public-configuration-api --task-id T122 --strict
  - git diff --check

validation_loop:
  focused_red:
    - Run public export, type consumer, config validator, ChartEditor and playground parser tests before implementation.
    - Record the expected missing export/type/module and behavioral failures.
  focused_green:
    - Run the same focused suites after the public facade, validator and playground rewrite.
  regression:
    - Run the complete release-candidate validation matrix without weakening existing thresholds.
  failure_policy:
    - Fix T122 failures only within allowed files.
    - Stop if a fix requires schema, dependency, G2 runtime, projection, command behavior or remote action.

evidence_contract:
  directory: .ai-platform/evidence/T122
  required:
    - summary.md
    - test-results.md
    - diff.patch
    - review.md
    - api-surface.md
    - desktop/mobile screenshots

review_contract:
  required_passes:
    - spec_compliance
    - bug_code_quality
    - qa_acceptance
  acceptance_rule: >-
    G002-R3 may move to Needs_Review only when all success criteria and full gates pass with no unresolved Critical,
    High or Medium finding. Only the user can mark the goal Accepted.

stop_conditions:
  - SourceData or ViewSpec schema changes are required.
  - A runtime or dev dependency is required.
  - Existing interaction, export or financial invariants regress.
  - Existing dirty baseline cannot be preserved.
  - A Critical or High review finding remains unresolved.
  - A remote action or publish is requested without separate approval.

handoff:
  remote_actions_authorized: false
  finish_state: Needs_Review
