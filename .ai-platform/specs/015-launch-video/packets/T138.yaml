tdd_plan:
  required: true
  red:
    command: pnpm --filter @tellplot/video test
    expected_failure: pointer metadata, renderer-sized drag ghost, grouping pacing and action cue alignment contracts are absent
  green:
    command: pnpm --filter @tellplot/video capture && pnpm --filter @tellplot/video render:smoke
    expected_signal: real cursor clips and cue-aligned product-led composition render
  refactor:
    command: pnpm --filter @tellplot/video render:review && pnpm --filter @tellplot/video media:audit
    expected_signal: no PPT sequence, empty frame, occlusion, or timing finding remains
validation_loop:
  commands: [focused tests, capture, render smoke, render full, render review, media audit, motion review, pnpm lint, pnpm typecheck, pnpm test:unit, pnpm build, artifact validator, git diff --check]
  retry_budget: 3
evidence_contract:
  summary: .ai-platform/evidence/T138/summary.md
  test_results: .ai-platform/evidence/T138/test-results.md
  required: [capture manifest, audio/action cue report, key frames, motion review, full validation]
review_contract:
  required_passes: [spec_compliance, motion_craft, bug_code_quality, qa_acceptance]
handoff:
