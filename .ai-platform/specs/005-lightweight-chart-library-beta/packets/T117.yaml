tdd_plan:
  red:
    - Require package version 0.1.0-beta.1 and README/LICENSE in the dry-run tarball.
    - Require compile-checked getting-started consumer and exact beta runtime exports.
    - Require ai command source rejection and host source acceptance.
  green:
    - Update package metadata, docs, command source and the minimum contract tests.
  refactor:
    - Replace stale T107/AI package wording without changing runtime behavior.

validation_commands:
  - pnpm format:check
  - pnpm lint
  - pnpm typecheck
  - pnpm test:unit
  - pnpm test:coverage
  - pnpm build
  - pnpm test:package
  - pnpm test:react-matrix
  - pnpm test:e2e
  - pnpm test:a11y
  - pnpm test:performance
  - mise exec node@22.20.0 -- pnpm test:browser-previous
  - python3 $HOME/.codex/skills/ai-delivery-governor/scripts/validate_delivery_artifacts.py --root . --feature-id 005-lightweight-chart-library-beta --task-id T117 --strict
  - git diff --check

validation_loop:
  focused_red:
    - Run command-source and package contract tests before implementation and record the expected failures.
  focused_green:
    - Run command-source, public API, quickstart type consumer and tarball contract after the minimum implementation.
  regression:
    - Run the full validation_commands matrix without weakening tests, thresholds or browser budgets.
  failure_policy:
    - Fix only failures caused by T117 inside the allowed files.
    - Stop when a fix would require runtime behavior, visual, schema, dependency or public-export changes.

