layout_review_correction:
  execution_attempt: T117-A003
  authorization: >-
    User explicitly approved the persistent-code, center-chart, right-panel layout and confirmed panel visibility
    must remain configurable on 2026-07-22.
  allowed_files:
    - packages/editor/src/react/editorTypes.ts
    - packages/editor/src/index.ts
    - packages/editor/src/components/FinancialChartEditor.tsx
    - packages/editor/src/components/EditorToolbar.tsx
    - packages/editor/src/components/PanelRail.tsx
