    - packages/editor/tests/components/**
    - packages/editor/tests/package/**
    - apps/playground/src/**
    - docs/api.md
    - e2e/**
    - .ai-platform/**
  scope:
    - Keep the existing default split layout unchanged.
    - Add typed optional outline placement and inspector presentation configuration.
    - Keep outline, inspector and toolbar visibility independently configurable through panels.
    - Show code by default on desktop and use a dialog on compact viewports.
    - Render the playground with chart center and an accessible right-side outline/inspector tab rail.
  forbidden:
    - No schema, chart projection, chart interaction, export, dependency, G2 runtime, remote Git or publish changes.

live_editor_review_correction:
  execution_attempt: T117-A004
  authorization: >-
    User explicitly requested an ECharts-like bidirectional demo editor with a light code theme on 2026-07-23.
  allowed_files:
    - apps/playground/src/**
    - apps/playground/tests/**
    - e2e/**
    - vitest.config.ts
    - .ai-platform/**
    - AGENTS.md
  scope:
    - Serialize the current playground source, view, appearance, panels and layout into one deterministic document.
    - Apply validated JSON edits to the chart after a short debounce and on Ctrl/Cmd+Enter.
    - Reflect command-produced ViewSpec changes back into the editor without rewriting source amounts.
    - Keep invalid drafts visible while preserving the last valid chart state and exposing a stable error path.
    - Use a dependency-free accessible light editor and keep installation/React/configuration examples available.
  forbidden:
    - No eval, new Function, arbitrary JavaScript or TypeScript execution, remote compilation or iframe runtime.
    - No public API, source/view schema, dependency, core command, chart projection, G2 runtime or export change.
    - No remote Git, publish or release action.

stop_conditions:
  - A runtime behavior, visual, schema, dependency or new public API is required.
  - Any accepted G001 regression remains red after a narrow reproducible fix attempt.
  - Tarball or declarations expose internal G2/runtime paths.
  - Remote Git, publish or release would be required to claim success.
