  product_contract: .ai-platform/docs/product-design.md
  feature_spec: .ai-platform/specs/016-tellplot-v2-release-readiness/spec.md
  requirements_checklist: .ai-platform/specs/016-tellplot-v2-release-readiness/checklists/requirements.md
  technical_decision: .ai-platform/docs/technology-decision-record.md#tdr-026-tellplot-20-current-release-lineage
  feature_plan: .ai-platform/specs/016-tellplot-v2-release-readiness/plan.md
  work_graph: .ai-platform/specs/016-tellplot-v2-release-readiness/tasks.md
