    first_failure: Fix only a demonstrated T116 ownership or lifecycle defect and rerun its smallest reproducer.
    second_failure: Compare against the accepted T115 baseline and separate refactor regression from environment flake.
    third_failure: Stop broadening the abstraction, revert only the failing T116 step from the external snapshot and record the blocker.
    beyond_budget: Never weaken a gate or change product behavior to claim architectural completion.

