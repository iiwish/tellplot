tdd_plan:
  required: true
  exception: null
  characterization:
    purpose: Establish accepted pre-refactor behavior before moving ownership.
    files:
      - packages/editor/tests/components/categorical-canvas.test.tsx
      - packages/editor/tests/components/categorical-editor.test.tsx
      - packages/editor/tests/components/chartPointer.test.ts
      - packages/editor/tests/export/chart-spec.test.ts
      - packages/editor/tests/export/categorical-chart-spec.test.ts
      - packages/editor/tests/export/svg.test.ts
      - packages/editor/tests/export/png.test.ts
      - packages/editor/tests/export/categorical-export.test.ts
    expected_signal: Existing waterfall/categorical screen, interaction and export tests pass before any source move.
  red:
    new_files:
      - packages/editor/tests/rendering/g2/chart-runtime.test.ts
      - packages/editor/tests/rendering/g2/export-runtime.test.ts
      - packages/editor/tests/package/architecture-boundary.test.ts
    sequence:
      - Lock constructor caching, newest-request-wins, stale initialization discard and exact-once destroy contracts.
      - Lock animation finish, event off, callback isolation and safe load/options/render error delivery.
      - Lock Canvas/SVG hidden-host removal for success plus constructor, render and reader failures.
      - Lock internal ownership and the absence of raw G2 runtime exports/import leakage.
    expected_failure: >-
      New tests fail because rendering/g2 modules and chart-family ownership paths do not exist and lifecycle behavior
      still lives separately in both Canvas and export implementations. The accepted characterization suite stays green.
  green:
    sequence:
      - Implement chartRuntime with only the lifecycle operations consumed by both accepted Canvas components.
      - Migrate WaterfallCanvas, verify scoped tests, then migrate CategoricalCanvas and verify deep-equal behavior.
      - Implement exportRuntime and migrate SVG then PNG while preserving format-specific sanitizer/encoder ownership.
      - Move family projection/spec/types into charts ownership one family at a time and update all internal/test imports.
      - Migrate waterfall X-axis calls to categoryAxis and remove compatibility wrappers only when unreferenced.
      - Add rendering coverage thresholds and update canonical architecture documentation.
    expected_signal: Every new contract test and all accepted behavior tests pass without public or visual changes.
  refactor:
    boundaries:
      - Compare every shared runtime member against at least two production consumers and delete one-consumer symmetry APIs.
      - Keep Canvas gesture composition and export format work outside rendering/g2.
      - Remove obsolete files/imports without introducing barrels or a registry.
      - Keep domain/public contracts untouched and run package declaration checks after final naming cleanup.

