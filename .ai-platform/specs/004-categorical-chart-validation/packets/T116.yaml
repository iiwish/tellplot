  proven_duplication:
    - Both Canvas components independently cache the dynamic @antv/g2 Chart constructor.
    - Both Canvas components own equivalent render request sequencing, stale discard and render flush queues.
    - Both Canvas components finish active animations before replacement or teardown.
    - Both Canvas components repeat options/render error mapping, event registration cleanup, destroy and callback isolation.
    - SVG and PNG exporters independently create, render, inspect, destroy and remove hidden G2 hosts.
    - Waterfall still consumes legacy horizontal wrappers while categorical consumes the accepted axis-neutral primitives.
  ownership_findings:
    - Waterfall projection/types belong to a waterfall chart module, not a top-level waterfall compatibility folder.
    - Categorical projection/spec/types belong to a categorical chart module.
    - waterfallChartSpec serves screen and export and therefore does not belong to export ownership.
    - SVG sanitization/serialization and PNG encoding are format-specific and remain in export modules.
    - chart-specific marks, projection, copy, gestures and label placement remain outside the shared runtime.
    - domain/chartPolicy.ts remains domain-owned unless execution proves a move reduces real coupling without making domain import chart modules.
  public_contract:
    - packages/editor/src/index.ts export names and types must remain unchanged.
    - Raw G2Spec, Chart, runtime handles and renderer callbacks remain internal and absent from generated declarations.
    - SourceData, ViewSpec, command wire shapes, error codes, appearance options and export options remain deep-equal.

required_design:
  chart_modules:
    target:
      - packages/editor/src/charts/waterfall/projection.ts
      - packages/editor/src/charts/waterfall/spec.ts
      - packages/editor/src/charts/waterfall/types.ts
      - packages/editor/src/charts/categorical/projection.ts
      - packages/editor/src/charts/categorical/spec.ts
      - packages/editor/src/charts/categorical/types.ts
    rules:
      - Move existing family-owned code and update imports; do not rewrite projection or spec semantics during the move.
      - Remove obsolete top-level waterfall/categorical and export/waterfallChartSpec paths only after all consumers migrate.
      - Do not add barrel files unless at least two current consumers benefit and the barrel does not create a public surface.
      - Keep domain chart policy in domain unless dependency evidence proves a family move improves direction without duplication.
  chart_runtime:
    target: packages/editor/src/rendering/g2/chartRuntime.ts
    responsibilities:
      - Cache and load the @antv/g2 Chart constructor.
      - Create one chart per mounted host and serialize options/render requests.
      - Discard stale queued requests and prevent late async initialization from reviving an unmounted chart.
      - Finish active G2 animations before a superseding render or teardown when required by accepted behavior.
      - Register and unregister G2 events deterministically.
      - Isolate consumer callbacks and map load/options/render failures to the existing safe render-issue contract.
      - Destroy the chart exactly once and leave no pending RAF, event or callback work after disposal.
    exclusions:
      - No chart type registry, plugin contract, projection dispatch or public extension hook.
      - No chart-specific marks, labels, appearance policy, gesture state, overlays or financial data.
      - No hand-drawn mark animation or replacement of G2 animation ownership.
      - Do not expose the G2 Chart instance outside the rendering boundary solely for convenience.
  export_runtime:
    target: packages/editor/src/rendering/g2/exportRuntime.ts
    responsibilities:
      - Create a hidden Canvas or SVG host with the accepted dimensions and ownerDocument.
      - Render a caller-supplied internal G2 spec using the shared constructor lifecycle.
      - Make the rendered surface available only inside a bounded format-reader callback and await sync or async readers.
      - Destroy G2 and remove the host in finally paths for success, load failure, render failure and reader failure.
    exclusions:
      - Keep SVG sanitization/serialization in svgExport.ts.
      - Keep PNG canvas encoding, Blob creation and browser error mapping in pngExport.ts.
      - Do not move chart-family spec selection into export runtime or return raw G2 objects.
  category_axis:
    - Migrate WaterfallCanvas to categoryAxis axis-neutral coordinate/bounds/drop primitives with axis x.
    - Preserve accepted threshold, collision, pointer capture, stale revision and semantic target behavior deep-equal.
    - Remove legacy horizontal wrappers from chartPointer only after all internal consumers and regression tests migrate.
    - Do not move domain eligibility, locked/pinned/group rules into geometry helpers.
  documentation:
    - Rewrite docs/architecture.md as the canonical current multi-chart architecture and dependency direction.
    - Document why runtime boundaries are internal, evidence-driven and intentionally not a plugin system.
    - Document retained exceptions when the implemented structure differs from the plan target for lower coupling.
  test_configuration:
    - Route packages/editor/tests/rendering/g2 tests through the jsdom component project so DOM lifecycle is exercised.
    - Replace obsolete waterfall/categorical coverage globs after module moves with charts/waterfall and charts/categorical.
    - Add rendering/g2 thresholds at 95% statements, branches, functions and lines without weakening domain thresholds.

forbidden_changes:
  - Do not alter source/view schemas, validation, commands, history, session, persistence, chart policy behavior or financial invariants.
  - Do not alter user-visible copy, visual appearance, animation timing, selectors, keyboard behavior or screenshots.
  - Do not add chart types, chart switching, multi-series, stacked/grouped bars, mobile product scope or AI behavior.
  - Do not add, remove or upgrade dependencies and do not change package manager or build tooling.
  - Do not introduce a public/internal generic registry, unused hook, service locator or framework-shaped abstraction.
  - Do not expose raw G2 types or runtime instances through index.ts, props, handles or generated declarations.
  - Do not weaken, delete or skip accepted tests, coverage thresholds, browser gates, accessibility gates or performance budgets.
  - Do not update visual baselines to hide a refactor regression.
  - Do not use any, @ts-ignore or @ts-expect-error.
  - Do not begin publish, release, remote Git or unrelated cleanup work.

