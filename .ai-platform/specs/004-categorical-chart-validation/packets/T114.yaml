    - git diff --check
  expected_signals:
    - Scene min/center/max is derived only from G2 getBounds for both axes; invalid and hostile inputs never throw.
    - Equivalent X and Y gestures resolve the same logical nodeId and before/after edge; value-axis movement is irrelevant.
    - Y preserves caller logical top-to-bottom order; reverse drags, origin, furthest crossing and translated rectangles are deterministic.
    - A 4px category threshold, stale revision, invalid bounds, missing source and no eligible target have stable structured failures.
    - Existing horizontal result objects and waterfall-related component tests remain deep-equal without updated expectations.
    - Artifact validator reports no errors or warnings for T114.
  retry_budget: 2
  failure_policy:
    first_failure: Read exact output and fix only behavior directly owned by T114.
    second_failure: Determine whether the failure is a scope, contract or environment blocker; do not widen files or guess renderer geometry.
    beyond_budget: Stop implementation, preserve RED/GREEN receipts and record blocked evidence.

