work_unit:
  title: 建立方向感知的分类轴交互
  goal: >-
    把当前 G2 scene bounds 与水平 pointer collision 收敛为 X/Y category-axis primitives，保持 waterfall
    与 column 的 X 行为 deep-equal，为 bar 提供 top-to-bottom Y 排序，并以冻结的 renderer-owned bounds、
    category-axis pointer coordinate 和结构化失败支撑 T115 集成。
  epic: E004
  story: S004-2
  requirements:
    - CAT-FR-006
    - CAT-FR-007
    - CAT-NFR-001
    - CAT-NFR-002
    - CAT-NFR-003
    - CAT-NFR-004
    - CAT-AC-002
    - CAT-AC-004
    - CAT-AC-007
  priority: P0
  depends_on:
    - T112 Accepted
  blocks:
    - T115
    - T116
  parallel: >-
    The work graph permits parallel execution with T113 only from the same accepted T112 baseline in separate
    worktrees. The current accepted T112 baseline is uncommitted, so this packet defaults to sequential direct
    execution and must not run concurrently in the current worktree.
  conflicts_with:
    - T113 categorical projection/spec ownership
    - T115 component gesture composition
    - T116 runtime extraction
    - Fixed chart dimensions or guessed bar width/row height
    - A second drag state machine or chart-family command path

codebase_context:
  local_instructions:
    - AGENTS.md
  relevant_files:
    - packages/editor/src/interactions/chartPointer.ts
    - packages/editor/src/interactions/moveTargets.ts
    - packages/editor/src/components/WaterfallCanvas.tsx
    - packages/editor/src/domain/model.ts
    - packages/editor/src/domain/viewTree.ts
    - packages/editor/src/domain/chartPolicy.ts
    - packages/editor/tests/components/chartPointer.test.ts
    - packages/editor/tests/components/group-actions.test.ts
  existing_patterns:
    - chartPointer.ts defensively reads the locked G2 5.4 event boundary, canvas coordinates, scene getBounds and element data without trusting DOM dimensions.
    - ChartSceneElementBounds already preserves the complete minX/minY/maxX/maxY renderer rectangle for hit testing and overlays.
    - resolveChartHorizontalDropTarget translates the dragged mark rectangle, compares only X edges, keeps logical orderedBounds input order and returns the furthest crossed sibling.
    - WaterfallCanvas owns pointer capture, the 4px threshold, RAF coalescing, preview lifecycle and cancellation; T114 does not edit that component.
    - PointerMoveIntent and resolvePointerMoveTarget are already axis-neutral semantic command adapters; chart geometry should continue to resolve only nodeId plus before/after.
    - Locked and same-parent eligibility belong to the validated projection/chart policy and caller-provided frozen candidate set, not renderer geometry.
  interfaces_or_contracts:
    - CategoryAxis is x or y.
    - ChartCategoryBounds contains nodeId plus scalar min, center and max on the selected category axis.
    - Axis-neutral read/collision results use discriminated success/failure results; legacy X wrappers retain their current undefined/null and targetX shapes.
    - Failure reasons distinguish invalid input or bounds, stale bounds revision, below-threshold movement, missing source and no eligible target without throwing.
  required_design:
    - Add categoryAxis.ts as the small scalar geometry kernel. It projects G2 scene rectangles and pointer points onto X or Y; it does not inspect amount or value-axis size.
    - Ordered bounds are supplied in logical top-level or same-parent order. Do not spatially sort them; for bar, logical first must remain top-to-bottom even when scene coordinates differ by renderer transforms.
    - Drop collision uses the translated source min/max edge crossing a sibling max/min edge and selects the furthest crossed eligible sibling in logical direction.
    - The axis-neutral input carries the pointer-down bounds revision, current render revision and configurable minimum drag distance. Revision mismatch and less-than-4px category-axis movement return structured failures.
    - Invalid or stale scene rectangles are rejected or skipped deterministically. Hostile event access/getBounds failures are caught and never escape.
    - Axis-neutral hit testing chooses before/after from the selected category coordinate while minimum target expansion still uses the real two-dimensional renderer rectangle.
    - Existing readChartElementPointer, resolveChartHorizontalDropTarget and readChartTargetX remain compatibility wrappers over the X primitive and preserve current deep-equal outputs.
    - Locked nodes and cross-container nodes are filtered by the caller's frozen eligible candidate set. Geometry must not duplicate chart policy; semantic command validation remains the final authority and stable error source.
  forbidden_changes:
    - Do not modify WaterfallCanvas, CategoricalCanvas, React components, CSS, categorical projection/spec, export runtime, package entrypoint or dependencies.
    - Do not read clientWidth, offsetWidth, fixed bar width, fixed row height or any guessed renderer dimension.
    - Do not introduce pointer capture, RAF scheduling, preview state, history writes or command dispatch into categoryAxis.ts.
    - Do not change existing horizontal wrapper return shapes or waterfall component expectations.
    - Do not use any, @ts-ignore or @ts-expect-error, and do not log G2 datum content or financial values.

