work_unit:
  title: 实现分类投影与 G2 Spec
  goal: >-
    建立一个确定性 categorical projection 和一个由 chartType 决定方向的 G2 5.4 interval
    spec factory，覆盖递归分组聚合、稳定逻辑顺序、安全金额、语义颜色、标签、annotation、
    emphasis、Tooltip 与 G2 原生 enter/update/exit animation，同时保持 waterfall 和公共 API 不变。
  epic: E004
  story: S004-2
  requirements:
    - CAT-FR-004
    - CAT-FR-005
    - CAT-FR-009
    - CAT-NFR-001
    - CAT-NFR-003
    - CAT-NFR-004
    - CAT-AC-003
    - CAT-AC-006
    - CAT-AC-007
    - CAT-AC-008
  priority: P0
  depends_on:
    - T112 Accepted
  blocks:
    - T115
    - T116
  parallel: >-
    The work graph permits parallel execution with T114 only from the same accepted T112 baseline in separate
    worktrees. The current accepted T112 baseline is uncommitted, so this packet defaults to sequential direct
    execution and must not run concurrently in the current worktree.
  conflicts_with:
    - T114 interaction ownership
    - T115 screen/export integration
    - T116 runtime extraction
    - Waterfall projection or rendering behavior
    - FinancialChartAppearance public shape or defaults
    - Any raw G2 public API

codebase_context:
  local_instructions:
    - AGENTS.md
  relevant_files:
    - packages/editor/src/domain/model.ts
    - packages/editor/src/domain/errors.ts
    - packages/editor/src/domain/validation.ts
    - packages/editor/src/domain/viewTree.ts
    - packages/editor/src/config/chartAppearance.ts
    - packages/editor/src/components/formatAmount.ts
    - packages/editor/src/waterfall/projectWaterfall.ts
    - packages/editor/src/waterfall/waterfallTypes.ts
    - packages/editor/src/export/waterfallChartSpec.ts
    - packages/editor/src/index.ts
    - packages/editor/tests/export/chart-spec.test.ts
    - vitest.config.ts
    - packages/editor/package.json
    - packages/editor/node_modules/@antv/g2/src/spec/animate.ts
    - packages/editor/node_modules/@antv/g2/src/spec/coordinate.ts
  existing_patterns:
    - projectWaterfall first calls validateViewSpec, returns ValidationResult, catches hostile input, and never emits a partial projection after a numeric failure.
    - Recursive narrative order comes from rootOrder and group childIds; collectLeafSourceIds provides deterministic logical leaf order for a validated tree.
    - Waterfall aggregation uses a Neumaier accumulator and rejects non-finite or greater-than-MAX_SAFE_INTEGER results with INVALID_SOURCE_DATA / UNSAFE_AMOUNT.
    - createWaterfallChartSpec is a pure G2Spec factory using interval, encode.key=nodeId, resolved appearance, formatAmount, Tooltip and G2 native animation.
    - The locked G2 dependency is 5.4.8 and locally declares transpose, growInX and growInY; no dependency change is needed.
    - Public package exports are curated only through packages/editor/src/index.ts; categorical projector/spec remain internal.
  interfaces_or_contracts:
    - CategoricalDatum has nodeId, label, amount, kind, sourceIds, locked and zero-based order exactly as data-model.md specifies.
    - CategoricalProjectionResult is the standard ValidationResult wrapping an immutable CategoricalDatum array.
    - projectCategorical accepts SourceData and ViewSpec, validates compatibility, and returns SOURCE_CONFLICT / INCOMPATIBLE_CHART_TYPE for non-categorical input.
    - The spec factory accepts one projection plus bar or column chartType, locale, currency, reducedMotion, label visibility, annotations, emphasis and FinancialChartAppearance.
  required_design:
    - Bar and column use the same projection object and semantic encode x=nodeId, y=amount, color=kind and key=nodeId.
    - Column uses Cartesian coordinates. Bar adds coordinate.transform transpose and reverses the category scale so logical order renders top-to-bottom.
    - Public axis.x and axis.y retain visual-axis meaning. For bar, map the transposed G2 channel axis configuration accordingly instead of changing the public appearance contract.
    - Direction-specific spec differences are limited to coordinate transform, category direction, visual-axis mapping, label placement and the native grow direction; data, key, palette, annotations, emphasis and Tooltip semantics stay equal.
    - Ordinary amount below zero maps to negative; zero and positive map to positive; every collapsed group maps to group.
    - reducedMotion, disabled animation or dense-canvas policy disables animation; otherwise use G2 native growInY for column, growInX for bar, morphing update and fadeOut exit.
    - A collapsed group emits one datum whose sourceIds follow logical leaf order, amount is a compensated sum, and locked is true when any descendant is pinned. Expanded groups emit no datum of their own.
    - Use a categorical-local, tested Neumaier accumulator. Do not move waterfall runtime merely to remove this small duplication before T116 has two integrated chart implementations to compare.
  forbidden_changes:
    - Do not modify React components, interactions, export runtime, waterfall source/tests, package entrypoint, dependencies or package metadata.
    - Do not connect the categorical spec to a live Chart instance; screen and export integration belong to T115.
    - Do not add a renderer abstraction, chart registry, plugin callback, second animation engine or generic chart runtime.
    - Do not change FinancialChartAppearance fields, default values or public exports.
    - Do not use any, @ts-ignore or @ts-expect-error, and do not log labels, amounts, source references or metadata.

