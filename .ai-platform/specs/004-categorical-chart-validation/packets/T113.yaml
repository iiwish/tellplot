    - python3 /Users/iiwish/.codex/skills/ai-delivery-governor/scripts/validate_delivery_artifacts.py --root . --feature-id 004-categorical-chart-validation --task-id T113
    - git diff --check
  expected_signals:
    - Empty, single, positive, negative, zero, duplicate-label and nested collapsed/expanded projections are deterministic.
    - Compensated aggregation, sourceIds, pinned descendants, mixed-sign groups and unsafe overflow match the approved data model.
    - Bar and column projections are deep-equal; spec differences are only the approved direction-sensitive fields.
    - G2 interval, stable key, category order, actual visual axes, palette, labels, annotations, emphasis, Tooltip and native animation are structurally asserted.
    - Existing waterfall spec tests pass without changed expectations and the package entrypoint has no new raw G2 or internal projection export.
