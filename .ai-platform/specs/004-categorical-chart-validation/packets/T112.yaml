    - packages/editor/src/domain/invariants.ts
    - packages/editor/src/domain/persistence.ts
    - packages/editor/src/domain/viewTree.ts
    - packages/editor/src/index.ts
    - packages/editor/src/waterfall/projectWaterfall.ts
    - packages/editor/src/components/FinancialChartEditor.tsx
    - packages/editor/src/interactions/groupSelection.ts
    - packages/editor/tests/domain/validation.test.ts
    - packages/editor/tests/domain/model.test.ts
    - packages/editor/tests/domain/commands.test.ts
    - packages/editor/tests/domain/persistence.test.ts
    - packages/editor/tests/domain/property-sequences.test.ts
    - packages/editor/tests/package/public-api.test.ts
    - packages/editor/tests/package/types-consumer.ts
  existing_patterns:
    - SourceData/ViewSpec are immutable JSON-compatible plain data with branded string IDs.
    - Validators inspect own enumerable data properties, reject unrecognized fields and hostile input, accumulate stable issues, and preserve successful input identity.
    - Session creation validates source and view before computing a deterministic non-cryptographic fingerprint.
    - Command execution validates pre/post invariants and never mutates SourceData or the input session.
    - Persistence emits deterministic JSON and validates parsed input against SourceData.
    - Existing legacy waterfall fixtures and snapshots are the compatibility baseline.
  interfaces_or_contracts:
    - .ai-platform/specs/004-categorical-chart-validation/data-model.md
    - .ai-platform/specs/004-categorical-chart-validation/contracts/editor-api.md
  required_design:
    - Preserve public SourceItem and SourceItemKind names as waterfall-compatible aliases.
    - SourceData is LegacyWaterfallSourceData | WaterfallSourceData | CategoricalSourceData.
    - Current SourceData uses schemaVersion 2.0.0 plus dataKind waterfall or categorical.
    - ViewSpec is LegacyWaterfallViewSpec | CurrentViewSpec; legacy/current source generations cannot mix.
    - Categorical defaults to column and accepts explicit bar; incompatible explicit chartType fails without fallback.
    - EditorCommand wire union remains unchanged.
    - Internal chart policy owns movable-item and container compatibility questions; it is not exported publicly.
  forbidden_changes:
    - Do not modify chart rendering, projection or interaction semantics; projectWaterfall.ts, FinancialChartEditor.tsx and groupSelection.ts may only narrow the exact new SourceData item union. Do not connect categorical UI, and do not modify CSS, export runtime, dependencies or package metadata.
    - Do not add setChartType, sorting, Top N or other commands.
    - Do not weaken legacy waterfall anchors, subtotal segments, group, pin or source-coverage invariants.
    - Do not expose projectors, policy, G2Spec, chart instance, renderer or plugin callbacks.
    - Do not log amount, label, sourceRef or metadata values.

