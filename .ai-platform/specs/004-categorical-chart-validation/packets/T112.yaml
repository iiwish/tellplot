  title: 扩展数据合同与共享命令策略
  goal: >-
    以严格判别联合支持 legacy waterfall、current waterfall 和 current categorical，建立
    source/view compatibility、初始 ViewSpec、version-preserving persistence、source fingerprint
    和最小内部 chart policy，同时保持现有 waterfall 与 command wire behavior 不变。
