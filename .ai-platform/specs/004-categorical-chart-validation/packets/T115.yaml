tdd_plan:
  required: true
  exception: null
  red:
    files:
      - packages/editor/tests/components/categorical-editor.test.tsx
      - packages/editor/tests/components/categorical-canvas.test.tsx
      - packages/editor/tests/export/categorical-export.test.ts
      - e2e/categorical-editor.spec.ts
    sequence:
      - Lock source-only column and explicit bar dispatch, real G2 render, logical summary and empty/invalid/render-error states.
      - Lock X/Y direct reorder, selection, cancel, pinned rejection, group/collapse/expand/ungroup and shared undo/redo behavior.
      - Lock canonical screen/export spec parity, SVG/PNG contents and active-preview export rejection.
      - Lock keyboard/outline/aria-live/reduced-motion, real-browser bar/column order and 200-item performance.
    expected_failure: >-
      New tests fail because FinancialChartEditor still always calls projectWaterfall, CategoricalCanvas and chart-neutral
      export do not exist, and the playground has no selectable categorical workflow. Existing waterfall tests remain green.
  green:
    sequence:
      - Implement the smallest chart-family dispatch and CategoricalCanvas needed for component render and summary tests.
      - Connect T114 category-axis gestures to the existing preview/command path, then add group and cancellation behavior.
      - Generalize internal export requests without changing the public handle, then wire playground fixtures and browser flows.
    expected_signal: New categorical tests pass while all previously accepted waterfall expectations remain unchanged.
  refactor:
    boundaries:
      - Remove only T115-local duplication that does not belong to T116 runtime extraction.
      - Keep chart-specific copy, projection, spec and gesture composition in their family component.
      - Preserve public API, schema, command wire shapes and default visual behavior.

validation_loop:
  commands:
    - pnpm exec vitest run packages/editor/tests/components packages/editor/tests/export packages/editor/tests/package
    - pnpm test:unit
    - pnpm test:coverage
    - pnpm typecheck
    - pnpm lint
    - pnpm format:check
    - pnpm build
    - pnpm test:package
    - pnpm test:react-matrix
    - pnpm test:e2e
    - pnpm test:a11y
    - pnpm test:performance
    - python3 $HOME/.codex/skills/ai-delivery-governor/scripts/validate_delivery_artifacts.py --root . --feature-id 004-categorical-chart-validation --task-id T115 --strict
    - git diff --check
  expected_signals:
    - Unit/component tests prove source/view dispatch, controlled/uncontrolled updates, one session/history path and waterfall regression.
    - Real G2 Canvas renders nonblank column and bar marks with rootOrder left-to-right/top-to-bottom and stable node IDs.
    - Equivalent X/Y pointer gestures commit the same semantic move; click, threshold, Escape, blur, stale render and pinned failures are deterministic.
    - Outline, keyboard, group, collapse, expand, ungroup, undo and redo update the same view and remain visible in canvas/summary.
    - SVG/PNG export is nonblank, uses canonical accepted state, matches chart type/order/appearance and rejects an active preview.
    - Axe has no serious/critical violations; summaries, focus, aria-live and reduced motion remain meaningful for both layouts.
    - 200 visible categorical items meet the existing real-browser performance budget without excessive React commits.
    - ESM/CJS/types, React 18/19 and current Chromium/Firefox/WebKit pass with no raw G2 public export.
  retry_budget: 3
  failure_policy:
    first_failure: Read exact output and fix only behavior owned by T115.
    second_failure: Separate implementation defects from flaky browser/environment evidence; rerun only after a justified fix or deterministic isolation.
    third_failure: Stop widening scope, record the blocker and preserve partial RED/GREEN evidence.
    beyond_budget: Mark blocked only under the active-goal blocked policy; never skip or weaken a gate to claim completion.

visual_qa:
  required_views:
    - column ready state at desktop viewport
    - bar ready state at desktop viewport
    - categorical group/collapsed state
    - categorical empty or invalid state
    - SVG and PNG export nonblank/order evidence
  checks:
    - Canvas has a nontrivial painted-pixel count and actual category marks.
    - First logical bar is topmost; first logical column is leftmost.
    - Toolbar, canvas, outline, inspector and overlays do not overlap at desktop and existing mobile regression viewports.
    - Long labels remain readable or are deterministically hidden by approved chart behavior.
    - Active targets, focus and feedback remain visible and do not resize stable controls.

