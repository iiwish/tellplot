    - AGENTS.md
  relevant_files:
    - packages/editor/src/components/FinancialChartEditor.tsx
    - packages/editor/src/components/WaterfallCanvas.tsx
    - packages/editor/src/components/AccessibleChartSummary.tsx
    - packages/editor/src/components/OutlinePanel.tsx
    - packages/editor/src/components/EditorToolbar.tsx
    - packages/editor/src/components/editorMessages.ts
    - packages/editor/src/react/useEditorController.ts
    - packages/editor/src/react/editorTypes.ts
    - packages/editor/src/categorical/projectCategorical.ts
    - packages/editor/src/categorical/categoricalChartSpec.ts
    - packages/editor/src/interactions/categoryAxis.ts
    - packages/editor/src/interactions/chartPointer.ts
    - packages/editor/src/interactions/moveTargets.ts
    - packages/editor/src/export/svgExport.ts
    - packages/editor/src/export/pngExport.ts
    - packages/editor/src/export/exportTypes.ts
    - packages/editor/src/export/waterfallChartSpec.ts
    - apps/playground/src/App.tsx
    - apps/playground/src/fixtures.ts
    - e2e/waterfall-editor.spec.ts
    - e2e/export.spec.ts
    - e2e/accessibility.spec.ts
    - e2e/performance.spec.ts
  existing_patterns:
    - FinancialChartEditor owns one controller, selection, preview, feedback, outline, inspector, history and export orchestration; chart dispatch must stay inside this component boundary.
    - useEditorController already validates compatible source/view unions and owns controlled/uncontrolled behavior; T115 must not create a categorical controller.
    - WaterfallCanvas is the accepted reference for dynamic G2 loading, request ordering, error isolation, native event registration, pointer capture, RAF, Escape/blur/unmount cancellation, marquee and group action overlays.
    - T116 owns shared G2 lifecycle extraction. T115 may build a separate CategoricalCanvas with local lifecycle code but must not introduce a generic runtime or move waterfall modules.
    - projectCategorical returns deterministic logical rootOrder data for both chart types; createCategoricalChartSpec changes only G2 direction and appearance semantics.
    - categoryAxis/chartPointer provide axis-neutral G2 event, bounds, collision, threshold and stale-revision primitives; moveTargets converts node plus before/after to existing commands.
    - OutlinePanel, InspectorPanel, EditorToolbar and useEditorController are chart-family-neutral unless their visible copy or item assumptions prove otherwise.
    - Existing SVG/PNG export sanitization, encoding, filename and error contracts remain authoritative; categorical export must select the matching projection/spec without forking public ExportOptions.
    - The playground is a thin host. It may select approved fixtures but must not own chart editing behavior.
  interfaces_or_contracts:
    - SourceData/ViewSpec are closed discriminated unions. current categorical source accepts only current bar/column view; no implicit migration or chart switching command exists.
    - CategoricalCanvas receives projection, chartType, annotations, emphasis, appearance and existing editor callbacks; it emits only semantic nodeId plus before/after targets.
    - Column uses X as category axis. Bar uses Y with logical rootOrder top-to-bottom. Value-axis movement never changes reorder targets.
    - Screen and export use createCategoricalChartSpec from the same canonical projection. Export disables Tooltip and animation/reduced-motion behavior as already specified.
    - Active chart or outline preview is never exportable; export uses the canonical accepted view only.
    - Empty, invalid and render error surfaces expose stable diagnostics without raw labels, amounts, sourceRef or metadata.

required_design:
  - Add a dedicated internal CategoricalCanvas rather than branching WaterfallCanvas into one large conditional component.
  - Reuse the accepted G2 native interval spec, scene bounds and event model. Do not hand-draw chart marks or animate them outside G2.
  - Dispatch source/view to projectWaterfall or projectCategorical only after controller compatibility validation; preserve strict narrowing and structured invalid state.
  - Keep one previewViewSpec path. Chart, outline and keyboard interactions resolve through moveTargets and executeCommand against the same session.
  - Freeze eligible same-parent renderer bounds and a render revision at pointer-down; cancel when the revision becomes stale. Locked/pinned rejection remains domain-authoritative and uses existing feedback codes.
  - Preserve pointer capture, 4px category-axis threshold, RAF coalescing, Escape/blur/unmount cancellation, click selection, minimum target and group actions for the categorical surface.
  - Keep the first bar datum visually topmost and the first column datum visually leftmost across canvas, outline, accessible summary and export.
  - Make export chart-neutral internally while retaining the current public handle and ExportOptions. SVG/PNG must use canonical data and the matching spec factory.
  - Provide chart-type-aware accessible title/summary and logical order. Keyboard and outline operations continue to work without pixel collision.
  - Add thin playground categorical fixtures and deterministic test selection so Playwright can exercise source-only column and explicit bar without changing package behavior.
  - Preserve existing waterfall selectors, screenshots, interaction expectations and default playground workflow unless a test explicitly selects a categorical fixture.
  - Verify dense 200-item categorical rendering and interaction in a real Chromium canvas; label density may be reduced through the approved spec behavior, not DOM guessing.

forbidden_changes:
  - Do not modify domain/**, categorical/**, interactions/**, waterfall/**, chartAppearance.ts, vitest.config.ts or dependencies.
  - Do not introduce setChartType, multi-series, stacked/grouped bars, dual axes, mobile-specific product scope or new public raw renderer types.
  - Do not copy session, history, command execution, group tree transforms, OutlinePanel state or source aggregation.
  - Do not read clientWidth/offsetWidth as a substitute for G2 scene bounds or assume a fixed bar width/row height.
  - Do not export active previews, mutate SourceData or log financial labels, amounts, sourceRef or metadata.
  - Do not use any, @ts-ignore or @ts-expect-error.
  - Do not begin T116, move modules for architectural symmetry, or extract a generic G2 runtime.

