    - bug_code_quality
    - qa_acceptance
  review_focus:
    - The same source/view/session/command/history path serves waterfall, column and bar without domain duplication.
    - G2 remains the renderer and animation owner; T115 does not hand-draw marks or preempt T116 runtime extraction.
    - rootOrder is identical across canvas, outline, summary and export, including top-to-bottom bar order.
    - Direct manipulation uses renderer scene bounds, frozen eligible candidates and T114 X/Y primitives without guessed dimensions.
    - Export uses canonical state and the same spec semantics; active previews and hostile states are rejected safely.
    - Public types remain closed and do not expose G2Spec/chart; errors/logs do not leak financial content.
    - Waterfall, package, React, current browser, a11y and performance regressions remain green.
