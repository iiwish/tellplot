stop_conditions:
  - A required behavior needs domain, categorical, interaction, waterfall, dependency or public raw-renderer contract changes.
  - G2 5.4 does not expose stable event/bounds behavior needed for real categorical interaction under the approved design.
  - Correct export requires replacing the existing sanitizer/encoder contract or exporting a preview state.
  - Current source/view compatibility cannot dispatch without implicit migration or a new chart-switching command.
  - T115 cannot keep waterfall expectations deep-equal or introduces a second session/history/command path.
  - A serious/critical accessibility issue or performance budget failure remains after the retry budget.
  - An unrelated user change appears in an allowed runtime or test file and cannot be safely preserved.
  - Strict artifact validation reports an unresolved Critical/High finding or missing packet field.
