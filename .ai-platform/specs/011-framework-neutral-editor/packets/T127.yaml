    command: pnpm --filter @tellplot/react test && pnpm --filter @tellplot/vue test
    expected_signal: adapter lifecycle contracts pass
  refactor:
    command: pnpm test:framework-matrix
    expected_signal: React 18/19 and Vue consumer scenarios pass
validation_loop:
  commands: [pnpm --filter @tellplot/react test, pnpm --filter @tellplot/vue test, pnpm typecheck, pnpm build, pnpm test:framework-matrix, git diff --check]
