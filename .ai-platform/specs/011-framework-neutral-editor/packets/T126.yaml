tdd_plan:
  required: true
  exception: null
  red:
    command: pnpm vitest run packages/editor/tests/runtime
    expected_failure: createEditor and framework-neutral DOM workbench are absent
  green:
    command: pnpm --filter @tellplot/editor test
    expected_signal: runtime lifecycle and full editor behavior pass
  refactor:
    command: pnpm test:e2e
    expected_signal: complete browser flows remain green
validation_loop:
  commands: [pnpm --filter @tellplot/editor test, pnpm --filter @tellplot/editor typecheck, pnpm --filter @tellplot/editor build, pnpm test:e2e, pnpm test:a11y, pnpm test:performance, git diff --check]
  retry_budget: 2
  failure_policy:
    first_failure: fix only runtime migration regression
    second_failure: audit interaction ownership and task scope
    beyond_budget: stop and record blocked evidence
