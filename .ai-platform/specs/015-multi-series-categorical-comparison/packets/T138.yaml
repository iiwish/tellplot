tdd_plan:
  required: true
  exception: null
  red:
    steps: exact receipt、four geometry、all-zero与lifecycle cancellation tests。
    command: pnpm exec vitest run packages/core/tests/interactions/categoryAxis.test.ts packages/editor/tests/rendering/g2/comparison-scene-receipt.test.ts packages/editor/tests/rendering/g2/chart-pointer.test.ts packages/editor/tests/rendering/g2/chart-runtime.test.ts packages/editor/tests/runtime/chart-surface.test.ts
    expected_failure: >-
      Focused tests fail because the private comparisonSceneReceipt adapter, N×S validation, four-purpose category geometry,
      all-zero renderer-band target or current-generation invalidation/settlement integration is missing. RED must not come from
      a fixture, timeout, environment error or a changed predecessor assertion.
  green:
    steps: 最小scanner/validator/geometry adapter与surface integration。
    command: pnpm exec vitest run packages/core/tests/interactions/categoryAxis.test.ts packages/editor/tests/rendering/g2/comparison-scene-receipt.test.ts packages/editor/tests/rendering/g2/chart-pointer.test.ts packages/editor/tests/rendering/g2/chart-runtime.test.ts packages/editor/tests/runtime/chart-surface.test.ts
    expected_signal: >-
      Strict current-generation N×S receipt, actual-rectangle exact/marquee geometry, axis-union drop, 2D ghost, renderer-band
      all-zero target and cancellation tests pass while comparison no-receipt behavior fails closed and scalar interaction stays green.
  refactor:
    steps: 只抽取pure receipt/axis helpers，保持G2 access集中于adapter。
    command: pnpm --filter @tellplot/editor test && pnpm --filter @tellplot/editor typecheck && pnpm release:architecture
    expected_signal: >-
      Editor tests, strict types and architecture stay green after only proven private helper extraction; core export names,
      T137 structural generation ownership and v1/v2 interaction contracts remain exact.

validation_loop:
  commands:
    - pnpm exec vitest run packages/core/tests/interactions/categoryAxis.test.ts packages/editor/tests/rendering/g2/comparison-scene-receipt.test.ts packages/editor/tests/rendering/g2/chart-pointer.test.ts packages/editor/tests/rendering/g2/chart-runtime.test.ts packages/editor/tests/runtime/chart-surface.test.ts
    - pnpm --filter @tellplot/editor test
    - pnpm --filter @tellplot/editor typecheck
    - pnpm --filter @tellplot/editor build
    - pnpm exec playwright test e2e/comparison-interaction.spec.ts e2e/interaction-cancel.spec.ts --project=chromium
    - pnpm release:architecture
    - node scripts/release/validate-package-surface.mjs
    - pnpm lint
    - git diff --check
  expected_signals:
    - Every visible projection node times every source series has exactly one current main-interval scene element in the authoritative receipt.
    - Missing, duplicate, unregistered, stale, wrong-type, wrong-mark, wrong-key, invalid-bounds or hostile scene data invalidates the complete receipt.
    - Scene traversal and helper-mark order cannot change receipt contents, projection/source order or any derived geometry.
    - Exact hit uses actual rectangles, inactive normal cluster gaps do not hit, active drag can use axis-union gaps and marquee deduplicates actual rectangle intersections by node.
    - Drop/action uses category-axis union with midpoint and projection-order tie; ghost is the full 2D union and all-zero ghost does not fabricate height.
    - Local and global all-zero targets use the complete renderer band and an interior 32 CSS px strip in column, bar, positive-only and all-negative domains without activating category padding.
    - Pointerdown finishes animation and verifies the current settled receipt; resize, render, source/view/config/readOnly change, pointer loss, Escape and unmount cancel without command/history and stale callbacks cannot revive it.
    - Any series mark maps to one category command; chart, Outline, keyboard and host command paths produce deep-equal view trees and exactly one history entry.
    - Invalid receipt disables comparison chart manipulation and action UI while Outline, keyboard and Inspector remain usable.
    - Core/public package export names remain exact; no G2 scene, receipt, geometry, generation, dependency, package-version or release surface is added.
  retry_budget: 2
  failure_policy:
    first_failure: Diagnose and fix only a T138-scoped receipt, structural guard, renderer geometry, pointer, surface lifecycle, cancellation, fixture or browser interaction issue.
    second_failure: Classify a scope, approved-contract, T137 predecessor, G2 5.4.8 scene/scale characterization, user-change, toolchain or environment blocker before any further edit.
    beyond_budget: Stop, keep tests truthful and record blocked evidence; never delete tests, weaken completeness/geometry assertions, substitute mocked/DOM geometry for real G2 evidence, or skip a required command.

