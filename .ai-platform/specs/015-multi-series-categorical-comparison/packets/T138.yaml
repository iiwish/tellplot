stop_conditions:
  - A confirmed governance input, approval gate, T137 review/evidence, dependency or this packet is missing or stale.
  - The pre-edit worktree differs from the recorded governance and reviewed T135-T137 baseline in a file that overlaps T138 ownership.
  - An unrelated user change overlaps an allowed runtime, test, e2e or fixture file and cannot be preserved without ambiguity.
  - Execution requires a file outside the exact allowed-files list or a broader use than its qualifier.
  - Execution requires changing an approved public, validation, editor, migration, data-model, plan, TDR or work-graph contract.
  - A RED test cannot be made to fail for the expected missing receipt, geometry, all-zero or lifecycle reason.
  - Passing T138 requires a partial receipt, trusting traversal order, first/last wins, DOM/fixed geometry or a test-only public scene hook.
  - Passing T138 requires adding/deleting/renaming a core/public export, changing commands or introducing series/cell state.
  - Passing T138 requires replacing T137 structural generation ownership, weakening its fixed interval/key contract or changing v1/v2 behavior.
  - Passing T138 requires T139 workbench/host/a11y or T140 export/docs/playground/package work.
  - Passing T138 requires a dependency, lockfile, transitive @antv/g import, package manifest/version, stale editor assertion, published 1.0 lineage, T131 evidence, workflow, remote Git, tag, publish, release or production change.
  - Real G2 Canvas scene/scale characterization cannot prove authoritative receipt, exact geometry or all-zero targets without changing TDR-025.
  - A validation command is unavailable or the retry budget is exhausted.
  - Analysis gains an unresolved Critical or High finding.
