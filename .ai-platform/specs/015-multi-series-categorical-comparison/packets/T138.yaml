review_contract:
  required_passes:
    - spec_compliance
    - bug_code_quality
    - qa_acceptance
  review_focus:
    - Exact current-generation N×S receipt completeness, fixed main interval identity, key/datum registry validation and traversal-order independence.
    - Atomic fail-closed behavior for missing, duplicate, unregistered, stale, hostile or invalid scene data with no partial receipt fallback.
    - Separation of actual-rectangle exact/marquee, axis-union drop/action, 2D ghost and renderer-band all-zero geometry.
    - Exact 32 CSS px plot-interior all-zero target in both orientations and positive/all-negative domains without DOM or fixed-band guesses.
    - Pointerdown finish/reread, geometry-change cancellation, frozen active-drag receipt and stale generation/render/observer rejection.
    - Any-series category-only command parity, invalid-receipt fallback and absence of series/cell state.
    - Exact v1/v2 behavior, core/public export allowlist, private G2 boundary and absence of T139/T140/dependency/release drift.
  acceptance_rule: >-
    T138 may enter Needs_Review only after validation and all three review passes report no unresolved
