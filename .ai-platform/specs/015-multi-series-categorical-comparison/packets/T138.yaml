work_unit:
  title: 建立 Authoritative Scene Receipt 与整组直接操作
  goal: >-
    把每个visible node × series的settled interval scene data收敛为严格authoritative receipt，并按exact/drop/
    ghost/marquee/all-zero用途派生renderer-owned geometry，使任意series mark只提交一条category command。
  epic: E015
  stories:
    - US-MSC-002
    - US-MSC-003
  requirements:
    - MSC-FR-005
    - MSC-NFR-001
    - MSC-NFR-003
    - MSC-NFR-005
    - MSC-NFR-006
  priority: P0
  depends_on:
    - T137 Needs_Review
    - T137 spec-compliance review passed
  blocks:
    - T139
    - T140
    - T141
  parallel: false
  conflicts_with:
    - T137
    - T139
    - G2 runtime
    - chart surface
    - pointer and geometry lifecycle

codebase_context:
  local_instructions:
    - AGENTS.md
  relevant_files:
    - packages/core/src/interactions/categoryAxis.ts
    - packages/core/tests/interactions/categoryAxis.test.ts
    - packages/editor/src/charts/categorical/comparisonSpec.ts
    - packages/editor/src/rendering/g2/chartPointer.ts
    - packages/editor/src/rendering/g2/chartRuntime.ts
    - packages/editor/src/editor/chartSurface.ts
    - packages/editor/src/editor/projection.ts
    - packages/editor/tests/rendering/g2/chart-pointer.test.ts
    - packages/editor/tests/rendering/g2/chart-runtime.test.ts
    - packages/editor/tests/runtime/chart-surface.test.ts
    - packages/core/tests/public-api.mjs
    - scripts/release/validate-package-surface.mjs
    - e2e/interaction-cancel.spec.ts
  existing_patterns:
    - >-
      categoryAxis.ts contains the existing renderer-neutral category-axis point, rectangle, drop, group-boundary and
      minimum-target primitives. It is re-exported by the public core entry, so T138 may refine private implementation
      behavior but cannot add, delete or rename any public exported identifier or comparison-specific type there.
    - >-
      chartPointer.ts is the private structural adapter for locked G2 event/context shapes. Its scalar path reads event datum
      and renderer bounds defensively; T138 must keep scalar behavior exact and place comparison N×S validation in the new
      comparisonSceneReceipt.ts adapter rather than widening a public core scene contract.
    - >-
      T137 fixed COMPARISON_INTERVAL_MARK_KEY to categorical-comparison-interval and uses reversible
      JSON.stringify(['comparison-element', nodeId, seriesId]) element keys in one interactive interval mark. Transparent
      point labels, annotations and region helpers are not receipt elements.
    - >-
      T137 chartRuntime.ts owns structuralIdentity and the private generation token. It cancels queued flush and resize work,
      destroys replaced charts and rejects stale constructor/render/forceFit continuations. T138 consumes that lifecycle and
      must not create a second generation owner.
    - >-
      chartSurface.ts already routes categorical projections by generation and deliberately fails comparison chart interaction
      closed. Scalar categorical and waterfall interaction currently use renderer bounds, category-axis projection, shared
      commands, marquee and cancellation; T138 replaces only the comparison branch with authoritative receipt geometry.
    - >-
      Runtime settlement is the only point at which a render can become authoritative. Existing interaction signatures and
      current editor revisions prevent stale scalar interaction; T138 binds the comparison receipt to current structural
      generation, render signature/revision and authoritative latest settlement.
    - >-
      Core and the public tellplot facade have exact export allowlists. packages/core/tests/public-api.mjs and
      validate-package-surface.mjs are proof-only T138 gates: no comparison receipt, geometry helper, scene shape or runtime
      handle may enter a public package entry.
  interfaces_or_contracts:
    - .ai-platform/specs/015-multi-series-categorical-comparison/contracts/editor-api.md#renderer-owned-geometry
    - .ai-platform/specs/015-multi-series-categorical-comparison/contracts/editor-api.md#exact-hit
    - .ai-platform/specs/015-multi-series-categorical-comparison/contracts/editor-api.md#drag-ghost-and-marquee
    - .ai-platform/specs/015-multi-series-categorical-comparison/plan.md#scene-receipt-and-direct-manipulation
    - .ai-platform/specs/015-multi-series-categorical-comparison/data-model.md
    - .ai-platform/docs/technology-decision-record.md#tdr-025-多序列分类比较与-g2-几何合同
  receipt_contract:
    - >-
      Build a private render-revision-bound receipt only after a success, latest, authoritative settlement for the current
      structural generation and current source/view/config/layout signature. Never export, log or serialize the receipt.
    - >-
      Derive the expected set from every visible comparison projection node times every declared source series in projection
      order and source series order. Each expected pair must have exactly one main interval scene element.
    - >-
      Accept only the fixed comparison main view/interval identity. For every accepted element require mark type interval,
      scene mark key categorical-comparison-interval, scene key equal to datum.elementKey, a registered nodeId/seriesId pair,
      the approved reversible tuple key, finite ordered bounds and the current render signature/revision.
    - >-
      Ignore point-label, annotation, region/background and legacy scalar helper marks as non-receipt elements. A scene element
      that claims the main comparison interval identity but has a wrong type, key, datum, registry entry, signature or bounds
      invalidates the complete receipt.
    - >-
      Reconstruct receipt contents in authoritative projection/source order; scene traversal order is never display or geometry
      order. Missing, duplicate, unregistered, stale, malformed or invalid interval data makes the whole receipt unavailable.
      Never return or use a partial Map, first-wins or last-wins result.
    - >-
      Structural access must fail closed on getters, proxies, sparse collections, throwing bounds, non-finite coordinates and
      stale objects. Do not import transitive @antv/g, expose a test-only scene hook or include raw business values in errors or
      evidence.
  geometry_contract:
    - Exact hit uses the actual interval rectangles only; a normal cluster's inner series gap remains noninteractive.
    - >-
      Marquee intersects every actual interval rectangle independently and then deduplicates by nodeId in projection order.
      A degenerate all-zero rectangle counts only when the marquee crosses its renderer baseline and never inherits the 32px
      pointer target.
    - >-
      Drop and action geometry use the union of all actual intervals for one node on the physical category axis. Adjacent
      minimum-target overlap is partitioned at axis midpoints and an exact tie selects the earlier projection item. Active drag
      may use a cluster inner gap; inactive gap starts marquee.
    - >-
      Ghost geometry is the full two-dimensional union of the node's actual interval rectangles. An all-zero ghost may be a
      baseline line and must not fabricate numeric height.
    - >-
      For a node whose every value is positive zero, derive the category-axis extent from the complete current G2 category band
      and derive zero baseline plus plot interior from current G2 scale/coordinate/layout data. Do not substitute the inset
      interval union, DOM estimates, fixed band width or fixed row height.
    - >-
      The all-zero pointer target stays inside the category band and plot interior. When value-axis interior span is at least
      32 CSS px, total thickness is exactly 32 CSS px, extending first in the positive direction and taking any shortfall from
      the negative direction; when the span is smaller, use the complete interior. Category padding remains noninteractive,
      while inner series gaps of that all-zero cluster may hit.
    - >-
      If the current G2 band scale, coordinate mapping, layout offset, zero baseline or plot interior cannot be read exactly,
      all-zero direct manipulation and any geometry that depends on it fail closed while Outline and keyboard remain usable.
  lifecycle_contract:
    - >-
      Consume T137's current structural generation token and geometry-invalidated/settled boundaries. A resize, render,
      accepted geometry-affecting presentation update, source/config/view replacement, readOnly disable or destroy first cancels
      active drag, marquee, hover, action rail and Tooltip without command/history, then invalidates the receipt.
    - >-
      A callback-identity-only update that does not render or relayout may retain the current receipt. An active drag may retain
      its pointerdown receipt only while no concurrent geometry-changing event occurs.
    - >-
      Pointerdown first finishes current animations and then rereads or verifies the settled current-generation receipt before
      starting any comparison interaction. A stale render Promise, ResizeObserver callback, pointer event or settlement cannot
      restore an invalidated receipt or write into a replacement runtime.
    - >-
      Any valid series interval maps to its category/group node and submits the existing category command exactly once. Direct
      chart, Outline, keyboard and host-command paths must produce deep-equal trees and one history entry; there is no series or
      cell command, selection or history state.
    - >-
      When the receipt is non-authoritative, comparison chart hit, drag, marquee, hover action and action rail stay disabled,
      while Outline, keyboard, Inspector and host commands remain available.
  forbidden_changes:
    - Adding, deleting or renaming any public export in packages/core/src/interactions/categoryAxis.ts or any package entry.
    - Exporting comparison receipt, geometry, scene element, G2 chart/view, generation token, render signature or test hook.
    - Accepting a partial receipt, trusting scene traversal order, using first/last wins, or estimating band/plot geometry from DOM or fixed dimensions.
    - Reading point-label, annotation, group-region/background or scalar helper marks into the comparison interval receipt.
    - Introducing series/cell commands, selection, pin, annotation, emphasis, history or persistence state.
    - Implementing T139 Inspector, summary, final focus/a11y or DOM/React/Vue host parity.
    - Implementing T140 SVG/PNG comparison export, public playground examples, docs, migration fixtures or local package 2.0 candidate work.
    - Changing v1/v2 scalar categorical or waterfall public, wire, persistence, screen, geometry, interaction or export behavior.
    - Adding a dependency, changing a lockfile, importing transitive @antv/g, or introducing a second renderer or DOM/Canvas overlay.
    - Changing package manifests, private package versions, the stale editor package assertion, published 1.0 lineage, T131 evidence, workflows, remote Git, tag, publish, release or production configuration.
    - Editing files outside execution_constraints.allowed_files.

