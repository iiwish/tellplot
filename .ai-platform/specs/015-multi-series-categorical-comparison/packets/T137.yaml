codebase_context:
  local_instructions:
    - AGENTS.md
  relevant_files:
    - packages/editor/src/charts/categorical/spec.ts
    - packages/editor/src/charts/groupRegions.ts
    - packages/editor/src/charts/labelStyle.ts
    - packages/editor/src/charts/safeTooltip.ts
