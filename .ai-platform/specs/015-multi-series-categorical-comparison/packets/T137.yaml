tdd_plan:
  required: true
  exception: null
  red:
    steps: exact spec、palette、Tooltip sort、label anchor、group extent与real G2 visible-order/alignment tests。
    command: pnpm exec vitest run packages/editor/tests/export/comparison-chart-spec.test.ts packages/editor/tests/rendering/comparison-group-regions.test.ts packages/editor/tests/export/safe-tooltip.test.ts packages/editor/tests/rendering/g2/chart-runtime.test.ts
    expected_failure: >-
      Focused tests fail because the comparison spec, palette/legend/Tooltip ordering, point-label transform, group regions,
      generation routing or fresh registry lifecycle is missing. RED must not be caused by a fixture, timeout or environment error.
  green:
    steps: 最小comparison adapter/helper marks/fresh registry runtime。
    command: pnpm exec vitest run packages/editor/tests/export/comparison-chart-spec.test.ts packages/editor/tests/rendering/comparison-group-regions.test.ts packages/editor/tests/export/safe-tooltip.test.ts packages/editor/tests/rendering/g2/chart-runtime.test.ts
    expected_signal: >-
      Canonical comparison screen spec, private palette, source-ordered legend/Tooltip, point helpers, group regions and fresh
      structural runtime tests pass without implementing T138 receipt/geometry or changing scalar behavior.
  refactor:
    steps: 提取screen/export共享spec builder，不泛化为public chart registry。
    command: pnpm --filter @tellplot/editor test && pnpm --filter @tellplot/editor typecheck && pnpm release:architecture
    expected_signal: >-
      Editor tests, strict types and architecture remain green after only proven private helper extraction; no public surface,
      raw-G2 boundary or v1/v2 visual contract expands.

validation_loop:
  commands:
    - pnpm exec vitest run packages/editor/tests/export/comparison-chart-spec.test.ts packages/editor/tests/rendering/comparison-group-regions.test.ts packages/editor/tests/export/safe-tooltip.test.ts packages/editor/tests/rendering/g2/chart-runtime.test.ts
    - pnpm --filter @tellplot/editor test
    - pnpm --filter @tellplot/editor typecheck
    - pnpm --filter @tellplot/editor build
    - pnpm exec playwright test e2e/comparison-rendering.spec.ts --project=chromium
    - pnpm release:architecture
    - pnpm lint
    - git diff --check
  expected_signals:
    - Canonical comparison spec contains one interactive interval with exact key, encodes, dodge, explicit domains, padding, value domain and orientation.
    - Marks, source-ordered read-only legend, shared Tooltip and point labels remain visibly ordered after accepted live registry reorder.
    - Bar and column Canvas point centers align with matching interval category-axis centers for both 2 and 4 series within declared pixel tolerance.
    - The fixed eight-cell bar/column by 2/4-series by mixed-sign/all-zero matrix passes, with additional all-zero positive-domain and all-negative-domain baseline coverage.
    - Nonzero/all-zero annotation anchors, flip/contain order and all-member-times-series group extent/cluster anchor are exact.
    - Helper marks cannot produce axis, legend or Tooltip items, intercept pointers, animate, or enter the main interval identity.
    - Empty comparison data preserves the registry and configured legend without fabricated business data.
    - Structural registry changes destroy the old identity and stale constructor, render or ResizeObserver continuations cannot write back or revive it.
    - Scalar categorical and waterfall spec/visual tests remain green; architecture proves comparison spec, labels, receipt and geometry are not public exports.
  retry_budget: 2
  failure_policy:
    first_failure: Diagnose and fix only a T137-scoped comparison spec, appearance, label transform, group-region, projection-routing, runtime-lifecycle, fixture or Canvas characterization issue.
    second_failure: Classify a scope, approved-contract, G2 5.4.8 characterization, existing-user-change, toolchain or environment blocker before any further edit.
    beyond_budget: Stop, keep tests truthful and record blocked evidence; never delete tests, weaken assertions, replace visible Canvas checks with mocked data, or skip a required command.

