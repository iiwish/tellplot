review_contract:
  required_passes:
    - spec_compliance
    - bug_code_quality
    - qa_acceptance
  review_focus:
    - Exact one-interval contract, source-order flattening, collision-safe keys, explicit scales/padding/palette and no value sorting.
    - Read-only legend and shared Tooltip visible order before/after registry change, including empty data behavior.
    - Point-attached labels, max-absolute annotation tie, all-zero category-center anchor and flip-before-contain transform.
    - All-member-times-series group extent, full-cluster group label anchor and helper-mark noninteraction.
    - Structural generation ownership, queued flush/observer cancellation and stale constructor/render/forceFit rejection.
    - Private generation routing, fail-closed comparison interaction, exact v1/v2 behavior and no T138-T140 leakage.
    - Real G2 Canvas evidence, architecture boundary and absence of public/dependency/release drift.
  acceptance_rule: >-
    T137 may enter Needs_Review only after validation and all three review passes report no unresolved
    Critical/High/Medium finding. It is not Accepted until user review, and G003 enters goal review only after T141.

handoff:
  external_issue: null
  pull_request: null
  finish_options:
    - Integrate T137 evidence and review, then make T138 Ready and generate only the T138 packet.
    - Keep the current worktree for the approved serial G003 sequence.
  prohibited_handoff:
    - stage, commit, push, pull request, tag, publish, release or production promotion without separate authorization

stop_conditions:
  - A confirmed governance input, approval gate, predecessor review/evidence, dependency or this packet is missing or stale.
  - An unrelated dirty-worktree change overlaps an allowed editor, test, e2e or fixture file.
  - Execution requires a file outside the exact allowed-files list or a broader use than its qualifier.
  - Execution requires changing the approved public, validation, editor, migration, data-model, plan, TDR or work-graph contract.
  - A RED test cannot be made to fail for the expected missing comparison presentation or lifecycle reason.
  - Passing T137 requires implementing T138 receipt/geometry/direct manipulation, T139 workbench/host behavior or T140 export/package/docs scope.
  - Passing T137 requires widening a public API, changing v1/v2 behavior, exposing G2 internals or adding a chart registry/second renderer.
  - Passing T137 requires a dependency, lockfile, transitive @antv/g import, package manifest/version, stale editor assertion, published 1.0 lineage, T131 evidence, workflow, remote Git, tag, publish, release or production change.
  - Real G2 Canvas characterization cannot prove visible series/legend order or point/interval alignment without replacing the approved TDR-025 design.
  - A validation command is unavailable or the retry budget is exhausted.
  - Analysis gains an unresolved Critical or High finding.
