    - packages/editor/src/editor/chartSurface.ts
    - packages/editor/src/editor/domEditor.ts
    - packages/editor/src/editor/outline.ts
    - packages/editor/tests/export/categorical-chart-spec.test.ts
    - packages/editor/tests/export/safe-tooltip.test.ts
    - packages/editor/tests/rendering/group-regions.test.ts
    - packages/editor/tests/rendering/g2/chart-runtime.test.ts
    - packages/editor/tests/runtime/editor.test.ts
    - scripts/release/check-architecture.mjs
    - apps/playground/src/fixtures.ts
  existing_patterns:
    - >-
      createCategoricalChartSpec is the exact v2 scalar path. It owns scalar G2 options, tooltip, text labels and group-region
      composition; comparison uses a separate private spec module and may extract only a genuinely shared helper without
      widening the scalar public or visual contract.
    - >-
      projectEditorChart returns a private family-discriminated projection. T137 adds generation:'scalar'|'comparison' to the
      categorical branch and calls the T136 projectCategoricalComparison runtime instead of coercing comparison data to the
      scalar CategoricalProjection.
    - >-
      createG2ChartRuntime dynamically loads the declared @antv/g2 dependency and owns constructor, request coalescing,
      render settlement, ResizeObserver and teardown. Structural series-registry changes must extend this lifecycle rather than
      create a second renderer or let stale async work write into a replacement chart.
    - >-
      chartSurface owns generation-aware screen-spec routing and the shared runtime. During T137, comparison chart pointer and
      direct manipulation remain fail-closed; authoritative receipt and comparison geometry are exclusively T138 scope.
    - >-
      groupRegions, labelStyle, safeTooltip and valueDomain contain existing bounded, safe presentation helpers. Reuse them only
      where their scalar assumptions remain valid; comparison-specific shape and anchor logic stays explicit.
    - >-
      Raw G2 access is architecture-allowlisted and private. No G2 spec, chart, appearance resolver, helper mark or generation
      handle is exported from a public package entry.
  interfaces_or_contracts:
    - .ai-platform/specs/015-multi-series-categorical-comparison/contracts/editor-api.md#g2-rendering-ownership
    - .ai-platform/specs/015-multi-series-categorical-comparison/contracts/editor-api.md#internal-flattened-data
    - .ai-platform/specs/015-multi-series-categorical-comparison/contracts/editor-api.md#interval-spec
    - .ai-platform/specs/015-multi-series-categorical-comparison/contracts/editor-api.md#labels-and-annotation
    - .ai-platform/specs/015-multi-series-categorical-comparison/data-model.md#series-registry
    - .ai-platform/specs/015-multi-series-categorical-comparison/plan.md#renderer-and-g2-design
    - .ai-platform/docs/technology-decision-record.md#tdr-025-多序列分类比较与-g2-几何合同
  presentation_contract:
    - >-
      Flatten comparison projection category-major and series-minor into private mark data with nodeId, categoryLabel,
      seriesId, seriesLabel, amount, locked, nodeKind, categoryOrder, seriesOrder and a collision-safe reversible
      JSON.stringify(['comparison-element', nodeId, seriesId]) elementKey.
    - >-
      Create exactly one interactive comparison interval child mark with fixed private mark identity, x=nodeId, y=amount,
      series/color=seriesId, key=elementKey and dodgeX(groupBy:'x', padding:0.08). Never order by value.
    - >-
      Derive category, series and color domains explicitly from current projection/source registry. Shared series-band settings
      are paddingInner=0.08 and paddingOuter=0; column category reverse is false and transposed bar reverse is true.
    - >-
      The value domain contains every visible amount and zero. Resolve a complete 2-4 color range from default palette plus
      safe overrides; color identifies series only and does not encode sign.
    - >-
      The color legend is source-ordered and read-only, with safe labels and explicit legendFilter:false and
      legendHighlight:false. Shared Tooltip title is the escaped node label and its items are source-ordinal series label/value
      pairs; tooltip:false disables the interaction explicitly.
    - >-
      Per-series value labels use transparent G2 point helpers with attached labels, collision-safe namespaced keys and exactly
      the interval's x/y/series domains and padding. Standalone text+dodgeX is forbidden.
    - >-
      Nonzero annotation emits one series-positioned point at the max-absolute endpoint, breaking ties by source order.
      All-zero annotation uses one point without a series channel at full category-band center and zero baseline.
    - >-
      Comparison expanded-group extent covers every visible member times every series plus zero. Its label uses a no-series
      transparent point at the first visible member's full cluster center and valueEnd. Collapsed groups emit no expanded region.
    - >-
      All helper marks are axis:false, legend:false, tooltip:false, animate:false, opacity:0 and pointerEvents:'none'. Apply the
      private label transform in the fixed order flip-to-interior then G2 exceedAdjust(bounds:'main'); structural guard failure
      fails closed and must not import transitive @antv/g.
    - >-
      Empty v3 categories preserve the explicit series registry and optional legend. If G2 5.4.8 needs a legend carrier, it is
      private and noninteractive and cannot fabricate a category, amount or business projection.
  lifecycle_contract:
    - >-
      A series registry ID, order or count change creates a fresh private G2 chart/view identity. T137 owns the runtime
      structuralIdentity/generation token and must cancel queued flush/observer work, increment generation, destroy the old
      chart and prevent stale constructor, render or forceFit continuations from writing into or reviving the new runtime.
    - >-
      Label-only and presentation-only updates may reuse the current runtime. T137 establishes geometry-invalidated/settled
      lifecycle boundaries only as needed for fresh identity; T138 consumes the current generation to build receipts and must
      not be preimplemented here.
    - >-
      Comparison projection/spec routing is private and generation-aware. Scalar categorical and waterfall runtime/spec/visual
      contracts remain exact, and comparison chart interaction fails closed until T138 supplies an authoritative receipt.
  forbidden_changes:
    - Implementing authoritative comparison scene receipt, exact/drop/ghost/marquee/all-zero geometry or category direct manipulation owned by T138.
    - Implementing final Inspector, summary, focus, accessibility or DOM/React/Vue host parity owned by T139.
    - Implementing real SVG/PNG comparison export, public playground examples, documentation, migration fixtures or local package 2.0 work owned by T140.
    - Exporting any public runtime, type, appearance resolver, raw G2 spec, G2 chart instance, helper mark, generation token or registry.
    - Changing v1/v2 scalar categorical or waterfall public, wire, persistence, screen, label, group-region or export behavior.
    - Adding a dependency, changing a lockfile, importing transitive @antv/g, or introducing a second renderer, DOM overlay or hand-calculated band width.
    - Changing package manifests, private package versions, the stale editor package assertion, published 1.0 lineage, T131 evidence, workflows, remote Git, tag, publish, release or production configuration.
    - Editing files outside execution_constraints.allowed_files.

