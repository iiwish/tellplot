    - complete update/readOnly/mode/panel/invalid/hostile branch state and exact callback-count receipts
    - imperative, React 18/19 and Vue 3 controlled/uncontrolled, view/defaultView and same-render/same-flush parity receipts
    - keyboard, aria-live, reduced-motion, color-independent state and axe receipts
