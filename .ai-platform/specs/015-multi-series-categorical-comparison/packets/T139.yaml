tdd_plan:
  required: true
  exception: null
  red:
    steps: exact Inspector、summary、focus、update、adapter与a11y contracts。
    command: pnpm exec vitest run packages/editor/tests/runtime/comparison-editor.test.ts packages/editor/tests/runtime/editor.test.ts packages/react/tests packages/vue/tests
    expected_failure: >-
      Focused tests fail because comparison Outline/Inspector/summary/focus/update or same-render/same-flush host parity is
      absent or still follows scalar-total semantics. RED must not come from a fixture, package-version baseline, timeout,
      environment error or a changed predecessor assertion.
  green:
    steps: 最小generation-aware presentation与existing adapter forwarding。
    command: pnpm exec vitest run packages/editor/tests/runtime/comparison-editor.test.ts packages/editor/tests/runtime/editor.test.ts packages/react/tests packages/vue/tests
    expected_signal: >-
      The imperative editor provides exact comparison Workbench, summary, focus, update and callback behavior; React and Vue
      forward the same behavior without comparison-owned state or a public API change.
  refactor:
    steps: 合并重复presentation formatting，不把comparison state复制到framework layers。
    command: pnpm --filter @tellplot/editor test && pnpm --filter @tellplot/react test && pnpm --filter @tellplot/vue test && pnpm typecheck
    expected_signal: >-
      Shared formatting and host forwarding stay green across v1/v2/v3 after only proven private extraction; adapter and
      imperative contracts remain one implementation surface.

validation_loop:
  commands:
    - pnpm exec vitest run packages/editor/tests/runtime/comparison-editor.test.ts packages/editor/tests/runtime/editor.test.ts packages/react/tests packages/vue/tests
    - pnpm --filter @tellplot/editor test
    - pnpm --filter @tellplot/react test
    - pnpm --filter @tellplot/vue test
    - pnpm test:framework-matrix
    - pnpm typecheck
    - pnpm build
    - pnpm exec playwright test e2e/comparison-interaction.spec.ts e2e/accessibility.spec.ts e2e/container-responsive.spec.ts --project=chromium
    - pnpm lint
    - git diff --check
  expected_signals:
    - Outline contains one treeitem per category/group, source-order series count and no total or series child.
    - Inspector exactly distinguishes category, collapsed group, expanded group and multi-selection without fabricated primary or cross-category values.
    - Empty and nonempty comparison summaries announce the complete source-ordered series registry and narrative DFS structural state.
    - Focus is retained only for connected, visible, enabled and focusable targets and otherwise follows the approved panel-aware fallback order.
    - Presentation, callback-only, source, category-set, generation, invalid-state, mode, panel, readOnly and history-limit updates follow the exact matrix and callback counts.
    - React same-render and Vue same-flush controlled pairs match imperative state; standalone view/defaultView and both controlled-mode transitions remain deterministic.
    - Framework matrix retains legacy v1 and adds real tarball/G2 v3 move/undo, registry reorder, palette, legend, summary and four-series update coverage without claiming v3 SVG export.
    - Keyboard, aria-live, reduced motion, focus visibility and color-independent semantics pass unit, browser and axe assertions.
    - T138 receipt/direct manipulation and v1/v2 workbench/focus/adapter behavior remain green; no public component field or event is added.
  retry_budget: 2
  failure_policy:
    first_failure: Diagnose and fix only a T139-scoped Workbench, summary, focus, update, callback, adapter, fixture, selector or accessibility issue.
    second_failure: Classify a scope, approved-contract, T138 predecessor, public-host parity, user-change, toolchain or environment blocker before any further edit.
    beyond_budget: Stop, keep tests truthful and record blocked evidence; never delete tests, weaken semantic/focus/callback assertions, move state into an adapter or skip a required command.

