    - e2e/comparison-interaction.spec.ts
    - e2e/container-responsive.spec.ts
    - e2e/editorPanels.ts
    - e2e/interaction-cancel.spec.ts
  existing_patterns:
    - >-
      The imperative editor and EditorStore own source/config/view validation, controlled/uncontrolled transitions, session,
      history, selection, callback counts and stable invalid state. React and Vue are thin lifecycle adapters and cannot own a
      second projection, session or G2 lifecycle.
    - >-
      T136 established the comparison projection and deterministic source/view update invariants. T137 established one
      generation-aware comparison interval, legend, Tooltip, labels and rendering. T138 established the private authoritative
      receipt and category-only direct manipulation. T139 consumes those seams without changing their projection, rendering or
      geometry contracts.
    - >-
      Outline, Inspector, summary, focus keys, modal/panel behavior and aria-live messages already support v1 waterfall and v2
      scalar categorical. Extend these established renderer-independent surfaces by narrowing the private projection generation;
      never inspect Canvas scene elements for text or accessible semantics.
    - >-
      Existing adapter props, emits, handles and public EditorOptions are exact public contracts. T139 proves v3 parity through
      existing signatures and host lifecycle tests; it adds no comparison-specific field, event, ref method or component state.
    - >-
      Existing framework matrix retains a legacy v1 scenario. T139 adds a real tarball/G2 v3 controlled pair and lifecycle
      parity but leaves v3 SVG evidence to T140, where comparison export is implemented.
  interfaces_or_contracts:
    - .ai-platform/specs/015-multi-series-categorical-comparison/contracts/editor-api.md#host-api
    - .ai-platform/specs/015-multi-series-categorical-comparison/contracts/editor-api.md#outline-and-inspector
    - .ai-platform/specs/015-multi-series-categorical-comparison/contracts/editor-api.md#tooltip-summary-and-accessibility
    - .ai-platform/specs/015-multi-series-categorical-comparison/contracts/editor-api.md#editor-update-matrix
    - .ai-platform/specs/015-multi-series-categorical-comparison/contracts/migration.md#session-and-controlled-host
    - .ai-platform/specs/015-multi-series-categorical-comparison/plan.md#editor-accessibility-and-host-integration
    - .ai-platform/docs/technology-decision-record.md#tdr-025-多序列分类比较与-g2-几何合同
  workbench_contract:
    - Outline has exactly one treeitem per visible category or group. A comparison row shows the localized series count and no fabricated total; series are never treeitems.
    - >-
      A single category Inspector lists every series label and formatted value in source order plus its annotation, emphasis,
      pinned/locked and editable state. A collapsed group lists per-series aggregates, collapsed state and source-category count.
    - >-
      An expanded group lists expanded state and source-category count but no unprojected aggregate. A multi-selection lists only
      selected-node count, source-category union count and legal group actions; it has no primary node, per-series values or
      cross-category amount aggregation. Only a single selection exposes annotation editing.
    - >-
      Category pin, category/group annotation and host emphasis apply to the complete node and all its series marks. No group
      pin, interactive emphasis command, series/cell selection or series/cell editing state is introduced.
    - >-
      Summary first announces visible cluster count and series count, then always reads the complete source-ordered series
      registry, including an empty items source with legend hidden. It then reads structural entries in narrative DFS order,
      preserving expanded/collapsed, source count, annotation, emphasis and locked semantics.
    - >-
      Summary and Inspector values use the comparison projection formatter and join structural ViewSpec state by node ID. They
      never derive content from Canvas or scene data. Full labels remain available even if compact visible text is truncated.
  focus_and_accessibility_contract:
    - >-
      Keep a stable focus-key target only while it remains connected, visible, enabled and focusable. Otherwise fall back in
      order to the first visible Outline treeitem, first available toolbar control, programmatically focusable chart-stage
      heading and editor root, skipping hidden panels, inactive modal content, disabled controls and Canvas-only marks.
    - >-
      A panel/mode/readOnly/source update that invalidates the focused target applies the fallback even when selection remains.
      Invalid state and selection removal use the same deterministic fallback and do not focus detached nodes.
    - >-
      Category ordering, grouping, collapse and pin retain equivalent Outline/keyboard paths, visible focus and aria-live
      feedback. Color is never the only identification of series, sign, lock, annotation or emphasis. Reduced motion remains
      respected.
  update_and_host_contract:
    - >-
      Presentation changes preserve view, session, history and selection and emit no command/view/selection callback; callback
      identity alone performs no render/layout. Geometry-affecting presentation changes cancel active interaction, preview and
      Tooltip before rendering.
    - >-
      Series registry order or other semantic source changes create the required fresh fingerprint/session, clear history and
      processed IDs, preserve only valid selection, immediately reorder every comparison surface, and emit no fabricated
      command or view callback. A real selection change emits exactly one selection callback.
    - >-
      Category ID, dataset, schema and chart-type boundaries follow the approved controlled/uncontrolled compatibility matrix.
      Invalid ordinary config/view enters the stable invalid state; hostile option or callback inspection atomically retains the
      prior valid state and uses the existing rejection path.
    - >-
      readOnly false-to-true cancels drag, marquee and Tooltip without command/history; true-to-false enables only currently
      legal controls and never restores an old interaction or emits a synthetic event.
    - >-
      React supplies a compatible controlled source/config and view in one render; Vue supplies them in one reactive flush.
      Standalone view/defaultView, controlled/uncontrolled transitions, panel/Inspector mode, readOnly and complete presentation
      updates must produce the same state, callbacks, series order, resolved palette and focus result as the imperative editor.
  forbidden_changes:
    - Adding or changing a public EditorOptions field, callback, EditorInstance method, React prop/ref method, Vue prop/emit/expose or v-model.
    - Introducing a comparison-only component API, framework-specific session/projection/G2 lifecycle or second state owner.
    - Adding series/cell treeitems, selection, commands, pin, annotation, emphasis, history or persistence state.
    - Showing a fabricated comparison total or cross-category amount aggregation in Outline, Inspector or summary.
    - Deriving Inspector/summary/a11y semantics from Canvas, scene receipt or visual color alone.
    - Changing T138 receipt, renderer geometry, all-zero target, pointer or lifecycle contracts beyond consuming its private API.
    - Implementing T140 SVG/PNG comparison export, public playground examples, docs, migration fixtures or local package 2.0 candidate work.
    - Changing v1/v2 public, wire, persistence, workbench, focus, adapter, interaction or export behavior.
    - Adding a dependency, changing a lockfile, package manifest/version, public export surface, release workflow or published 1.0 lineage.
    - Editing files outside execution_constraints.allowed_files.

