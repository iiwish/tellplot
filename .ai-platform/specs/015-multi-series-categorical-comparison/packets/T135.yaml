tdd_plan:
  required: true
  exception: null
  red:
    steps: 先添加schema/config/public type与旧variant精确fixture，确认missing exports与validation mismatch。
    command: pnpm exec vitest run packages/core/tests/domain/schema-v3.test.ts packages/core/tests/config/comparison-chart-config.test.ts apps/playground/tests
    expected_failure: Missing schema 3 types, exact exports, validation reasons or generation guards cause focused tests to fail for the intended contract reason.
  green:
    steps: 最小增加v3 concrete contracts、validator与防御性generation branches。
    command: pnpm exec vitest run packages/core/tests/domain/schema-v3.test.ts packages/core/tests/config/comparison-chart-config.test.ts apps/playground/tests
    expected_signal: Focused schema, config, public type, legacy identity, and exhaustive-guard tests pass without a comparison runtime projector.
  refactor:
    steps: 在tests green后抽取schema-specific helper，保持closed path与v1/v2 identity。
    command: pnpm --filter @tellplot/core test && pnpm --filter @tellplot/core typecheck && pnpm release:architecture
    expected_signal: Core tests and architecture remain green after schema-specific helper cleanup.

validation_loop:
  commands:
    - pnpm exec vitest run packages/core/tests/domain/schema-v3.test.ts packages/core/tests/config/comparison-chart-config.test.ts apps/playground/tests
    - pnpm --filter @tellplot/core test
    - pnpm --filter @tellplot/core typecheck
    - pnpm --filter @tellplot/core build
    - pnpm typecheck
    - pnpm build
    - pnpm --filter @tellplot/core test:package
    - pnpm --filter @tellplot/editor test:package
    - node scripts/release/validate-package-surface.mjs
    - pnpm test:package
    - pnpm release:architecture
    - pnpm lint
    - git diff --check
  expected_signals:
    - Valid, empty, two-series, and four-series inputs pass; all invalid closed and relational inputs fail atomically with approved results.
    - Config-embedded source errors retain exact path prefixes, privacy-safe details, and hostile input identity.
    - Schema 3 validation preserves 0/-0 identity while fingerprint canonicalizes them; v1/v2 signed-zero behavior stays unchanged.
    - CurrentSchemaVersion, concrete v1/v2 types, and existing projector signatures remain exact.
    - Playground exhaustive consumers explicitly reject or narrow schema 3 and never route it through waterfall.
    - projectCategoricalComparison remains unimplemented at T135 completion.
  retry_budget: 2
  failure_policy:
    first_failure: Diagnose and fix only a T135-scoped schema, validation, public-surface, compile-guard, fixture, or architecture issue.
    second_failure: Classify a scope, approved-contract, existing-user-change, toolchain, or environment blocker before any further edit.
    beyond_budget: Stop, keep tests truthful, and record blocked evidence; never delete tests, weaken assertions, or skip a required command.

