stop_conditions:
  - A confirmed governance input, approval gate, dependency, or this packet is missing or stale.
  - An unrelated dirty-worktree change overlaps an allowed runtime or test file.
  - Execution requires a file outside the exact allowed-files list or a broader use than its qualifier.
  - Execution requires changing the approved public, validation, editor, migration, data-model, plan, TDR, or work-graph contract.
  - A RED test cannot be made to fail for the expected missing schema, export, validation, or generation-guard reason.
  - Passing T135 requires implementing projectCategoricalComparison or otherwise entering T136-T141 scope.
  - Passing T135 requires changing CurrentSchemaVersion, v1/v2 concrete types, existing projector signatures, or v1/v2 signed-zero behavior.
  - Passing T135 requires any dependency, lockfile, G2/DOM/framework import into core, published 1.0 lineage, T131 evidence, workflow, remote Git, tag, publish, release, or production change.
  - A validation command is unavailable or the retry budget is exhausted.
  - Analysis gains an unresolved Critical or High finding.
