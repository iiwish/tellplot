    - scripts/release/audit-release.mjs
    - scripts/release/package-artifact.mjs
    - scripts/release/rehearse-source.mjs
    - scripts/release/package-contracts.json
  existing_patterns:
    - >-
      exportSvgChart and exportPngChart use a private discriminated request, create a fresh offscreen G2 runtime through
      withOffscreenG2Render, disable interaction through the selected chart spec, sanitize SVG and return the unchanged public
      ExportResult. Extend the request by schema/projection generation; chartType alone cannot distinguish scalar v2 from
      comparison v3.
    - >-
      T137 already owns createCategoricalComparisonSpec, source-ordered registry/palette/legend, labels, group regions,
      annotations and emphasis. T140 reuses that same projection/spec semantics for fresh SVG/PNG and may repair its canonical
      comparison spec only when a T140 RED proves an approved contract defect.
    - >-
      T139 already owns the comparison Workbench, update matrix and real Imperative/React 18/React 19/Vue 3 Canvas settlement
      matrix. T140 adds v3 SVG export receipts to those established host scenarios without moving state or export ownership
      into React/Vue and without weakening the legacy v1 scenario.
    - >-
      packages/tellplot is the only public package and keeps the existing root, core, react, vue and styles.css export map.
      Internal @tellplot/core, @tellplot/editor, @tellplot/react and @tellplot/vue packages remain private 0.0.0 workspace layers.
    - >-
      Existing release:audit, release:artifact and release:rehearse are accepted 1.0/T131 lineage commands. They are read-only
      immutability fixtures during T140 and are not patched to accept the current 2.0 candidate. New release:candidate:* commands
      validate the current manifest and write only the explicitly selected T140/T141 evidence root.
    - >-
      Documentation is canonical present-tense content. A local extraction harness compiles every TypeScript fence in data
      contract, API, configuration and migration docs against built candidate declarations; non-standalone fragments are
      explicitly composed rather than silently skipped.
  interfaces_or_contracts:
    - .ai-platform/specs/015-multi-series-categorical-comparison/contracts/public-api.md#public-entrypoints
    - .ai-platform/specs/015-multi-series-categorical-comparison/contracts/public-api.md#new-named-exports
    - .ai-platform/specs/015-multi-series-categorical-comparison/contracts/public-api.md#package-and-type-contract
    - .ai-platform/specs/015-multi-series-categorical-comparison/contracts/editor-api.md#export
    - .ai-platform/specs/015-multi-series-categorical-comparison/contracts/migration.md
    - .ai-platform/specs/015-multi-series-categorical-comparison/plan.md#export-design
    - .ai-platform/specs/015-multi-series-categorical-comparison/plan.md#public-package-documentation-and-migration
    - .ai-platform/specs/015-multi-series-categorical-comparison/plan.md#published-10-lineage-boundary
  export_contract:
    - >-
      Screen, SVG and PNG use the same comparison projection, source-ordered series registry, resolved palette, legend
      visibility/order, number formatting, value labels, expanded group regions, annotations and emphasis. Export contains no
      Tooltip DOM, selection/hover/drag overlay, animation or remote resource.
    - >-
      Real SVG covers bar and column, 2 and 4 series, mixed-sign and all-zero fixtures. It asserts point/interval
      category-axis center tolerance, annotation and group anchors, live registry reorder by visible legend text bbox/order,
      empty legend on/off and sanitizer behavior. A component-data assertion alone is insufficient.
    - >-
      PNG uses the same comparison spec and palette/legend semantics and produces a nonblank pixel surface for the same
      projection. It does not reuse the on-screen Canvas or bypass the fresh offscreen runtime.
    - >-
      A legal v3 source with zero categories exports title, configured dimensions and background. Legend enabled retains all
      source-ordered series entries through explicit domain/range; legend disabled emits none. Existing v1/v2 empty/export
      behavior remains exact.
    - >-
      EditorInstance.exportImage, React/Vue handles, ExportOptions, ExportResult and error unions remain exact. There is no
      comparison-specific public export method, option, result or error.
  package_and_migration_contract:
    - >-
      The local public manifest is exactly tellplot@2.0.0. The export map is unchanged and the public root/core surface contains
      exactly the approved 16 comparison type exports and projectCategoricalComparison as the only new runtime export. G2,
      palette/appearance resolvers, spec factories, scene receipts, geometry adapters and migration helpers remain private.
    - >-
      Concrete legacy-v1-waterfall, current-v2-waterfall and scalar-v2-categorical source/view/config fixtures compile, run and
      round-trip unchanged. Comparison-v3 construction, projection and package consumers compile in strict isolated projects.
    - >-
      An exhaustive public-union fixture fails before migration with the expected missing v3 diagnostic, then the migrated
      fixture succeeds by adding explicit schema 3 handling. The test uses separate negative/positive programs and no any,
      @ts-ignore or @ts-expect-error.
    - >-
      Migration docs provide two host-side paths: construct a fresh v3 view or explicitly preserve category narrative state
      after host validation. No runtime migration helper, heuristic schema conversion or v1/v2 wire change is added.
    - >-
      Every TypeScript fence in data contract, API, configuration and migration documentation is extracted and compiled.
      Non-standalone fragments have an explicit composition group; an arbitrary skip marker is not accepted.
  playground_contract:
    - >-
      Add public-only actual-vs-budget 2-series and business-line 4-series examples. They import only tellplot public
      entrypoints and support group/category editing, collapse, workbench ViewSpec import/export and SVG/PNG export through the
      existing public editor surface.
    - >-
      Playground fixtures/tests prove the displayed actual-versus-budget and four-series journeys; they do not import a private
      workspace package, private comparison spec, scene receipt, palette resolver or migration helper.
  candidate_tooling_contract:
    - >-
      release:candidate:audit, release:candidate:artifact and release:candidate:rehearse are local-only commands. Each requires
      both --candidate-version 2.0.0 and --evidence-task T140 or T141, rejects a missing/duplicate/unsupported argument, rejects
      every other version/task and rejects absolute paths, separators, dot segments, encoded traversal or symlink escape.
    - >-
      Candidate audit reads the current public manifest, requires tellplot@2.0.0, private 0.0.0 workspace layers, the approved
      export map and exact public surface. Candidate artifact creates a reproducible canonical tarball manifest/hash only below
      the selected `.ai-platform/evidence/T140` or `.ai-platform/evidence/T141` directory. Candidate rehearsal copies clean
      source without evidence/build outputs, performs a frozen install and candidate gates, and writes its receipt only below
      that same selected evidence task.
    - >-
      Candidate tooling must not invoke, rewrite, parameterize or redirect release:audit, release:artifact, release:rehearse,
      release:check, release:preflight*, release:availability or release:trust-readiness*. Existing 1.0 commands may be replayed
      only inside a deterministic isolated 1.0 lineage fixture; they are never a 2.0 candidate gate. Candidate tooling must not
      touch T131 evidence or a publish workflow and must perform no network publish, registry availability, tag, GitHub Release
      or production action.
  forbidden_changes:
    - Adding or changing a public export subpath, EditorInstance/React/Vue export API, comparison-only option/result/error or runtime migration helper.
    - Exporting G2, raw spec, palette/appearance resolver, scene receipt, geometry adapter or internal export request.
    - Implementing a second comparison projection/spec, copying screen Canvas or using mocked renderer output as real SVG/PNG evidence.
    - Changing T137/T138 rendering, receipt, geometry, direct manipulation or T139 Workbench/focus/update behavior beyond a proven T140 export-dispatch seam.
    - Changing v1/v2 concrete types, wire, runtime, persistence, screen, export, package or framework behavior.
    - Changing a private workspace package version, dependency, lockfile, package manager, public export map or publishConfig.
    - Editing .ai-platform/evidence/T131, .github/workflows, accepted release scripts or remote state.
    - Running stage, commit, push, PR, tag, npm publish, GitHub Release, registry availability, Trusted Publisher, public preflight or production commands; an isolated deterministic 1.0 lineage fixture may execute read-only legacy validation.
    - Implementing T141 performance/responsive/full-matrix work or generating the T141 packet.
    - Editing files outside execution_constraints.allowed_files or beyond an allowed-file qualifier.

