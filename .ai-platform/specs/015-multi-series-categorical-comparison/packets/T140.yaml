  - The pre-edit worktree differs from the recorded governance and reviewed T135-T139 baseline in a file that overlaps T140 ownership.
  - An unrelated user change overlaps an allowed export, package, docs, playground, framework, candidate-tool or browser file and cannot be preserved without ambiguity.
  - Execution requires a file outside the exact allowed-files list or broader use than its qualifier.
  - Execution requires changing an approved public, validation, editor, migration, data-model, plan, TDR or work-graph contract.
  - A RED test cannot fail for the expected missing export, 2.0 package, docs fence, migration, playground or candidate-isolation reason.
  - Passing T140 requires mocked SVG/PNG evidence, screen Canvas copying, a second comparison projection/spec or component-data-only legend order proof.
  - Passing T140 requires changing EditorInstance/React/Vue export signatures, an export subpath or exposing an internal runtime/G2/migration helper.
  - Passing T140 requires changing T137/T138 rendering/geometry, T139 Workbench/focus/update behavior or v1/v2 wire/runtime/persistence/export behavior.
  - Passing T140 requires a dependency, lockfile, private package version, package manager, publishConfig, accepted release script or public workflow change.
  - Passing T140 requires writing T131 evidence, accepting a candidate version other than 2.0.0, accepting a task other than T140/T141 or allowing any path traversal/symlink escape.
  - Passing T140 requires using release:audit, release:artifact, release:rehearse, release:check, release:preflight*, release:availability or release:trust-readiness* as a 2.0 candidate gate, or requires publish, tag, remote Git or production commands; deterministic isolated 1.0 lineage replay is the only allowed legacy-command execution.
  - Passing T140 requires T141 performance/responsive/full-matrix work, T141 evidence/status or a T141 packet.
  - A validation command is unavailable or the retry budget is exhausted.
  - Analysis gains an unresolved Critical or High finding.
