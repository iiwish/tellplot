      three concrete legacy generations remain green after only evidence-backed private extraction.

validation_loop:
  commands:
    - pnpm exec vitest run packages/editor/tests/export/comparison-export.test.ts apps/playground/tests packages/tellplot/tests
    - pnpm exec vitest run packages/editor/tests/package
    - pnpm --filter @tellplot/playground build
    - pnpm build
    - pnpm test:package
    - pnpm test:framework-matrix
    - pnpm exec playwright test e2e/comparison-export.spec.ts e2e/live-code-editor.spec.ts e2e/quickstart.spec.ts e2e/showcase.spec.ts --project=chromium
    - pnpm release:candidate:audit -- --candidate-version 2.0.0 --evidence-task T140
    - pnpm release:candidate:artifact -- --candidate-version 2.0.0 --evidence-task T140
    - pnpm release:candidate:rehearse -- --candidate-version 2.0.0 --evidence-task T140
    - pnpm lint
    - git diff --check
  expected_signals:
    - Real SVG bar/column x 2/4-series x mixed-sign/all-zero matrix shares screen order, palette, legend, labels, groups, annotations and emphasis.
    - Visible SVG legend text bbox/order changes immediately after a live registry reorder; empty legend on/off follows source order and configuration.
    - PNG uses the same projection/spec and returns nonblank pixels with expected dimensions/background without copying screen Canvas.
    - Legal empty v3 SVG/PNG exports title, dimensions and background; existing v1/v2 empty/export behavior remains green.
    - SVG sanitizer removes interaction, animation, unsafe nodes/attributes and remote resources without leaking source values.
    - Actual-vs-budget and four-series playground examples use only public entrypoints and complete edit, collapse, ViewSpec import/export and image export journeys.
    - Legacy v1 waterfall, current v2 waterfall and scalar v2 categorical concrete source/view/config compile, run and round-trip unchanged.
    - The v3 package consumer and migrated exhaustive-union fixture compile; the unmigrated fixture fails only with the expected missing-v3 diagnostic and uses no suppression.
    - Every TypeScript fence in data contract, API, configuration and migration docs is extracted and strict-compiled; every fragment belongs to an explicit composition.
    - tellplot manifest is exactly 2.0.0, export map unchanged, private packages remain 0.0.0 and public surface is exactly the approved 16 types plus one runtime projector.
    - Imperative DOM, React 18, React 19 and Vue 3 retain T139 Canvas/update receipts and add real v3 SVG order/palette/legend/empty parity.
    - Candidate audit/artifact/rehearsal require exact arguments, reject traversal and write only T140 evidence; T131, workflows and legacy release commands remain byte-for-byte unchanged.
    - No dependency, lockfile, network, registry availability, publish, tag, release, remote Git or production side effect occurs.
  retry_budget: 2
  failure_policy:
    first_failure: Diagnose and fix only a T140-scoped export, package consumer, docs fence, playground, candidate-tooling, fixture or browser assertion.
    second_failure: Classify a scope, approved contract, T139 predecessor, T131 lineage, public-surface, user-change, renderer, toolchain or environment blocker before any further edit.
    beyond_budget: Stop, preserve every failure and do not weaken SVG geometry/order, migration diagnostic, package surface, traversal, lineage or legacy assertions and do not skip a required command.

