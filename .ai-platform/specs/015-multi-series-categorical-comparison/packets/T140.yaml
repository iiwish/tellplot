  local_instructions:
    - AGENTS.md
  relevant_files:
    - packages/editor/src/export/exportOptions.ts
    - packages/editor/src/export/exportTypes.ts
    - packages/editor/src/export/svgExport.ts
    - packages/editor/src/export/pngExport.ts
