    - packages/core/tests/editorStore.test.ts
    - packages/core/tests/public-api.mjs
    - scripts/release/package-contracts.json
    - scripts/release/validate-package-surface.mjs
  existing_patterns:
    - >-
      projectCategorical validates source/view first, recursively traverses the narrative tree, uses Neumaier compensated
      aggregation for collapsed groups, returns an atomic ValidationResult and never mutates source or view.
    - >-
      comparisonTypes.ts already defines the approved CategoricalComparisonDatum and result types from T135; T136 adds the
      separate comparisonProjection.ts implementation rather than widening the v2 CategoricalDatum contract.
    - >-
      createEditorSession owns immutable source identity, schema-specific fingerprints, history stacks and processed action IDs;
      executeCommand, history and viewTree remain the only category/group narrative mutation path.
    - >-
      createEditorStore validates complete options atomically, separates controlled and uncontrolled state, reconciles selection
      by category/group node IDs and avoids synthetic command/view callbacks during host updates.
    - >-
      Public core symbols and the single-package facade are explicit allowlists checked by public-api, core package and
      validate-package-surface fixtures; core stays free of G2, DOM, React and Vue imports.
  interfaces_or_contracts:
    - .ai-platform/specs/015-multi-series-categorical-comparison/data-model.md#comparison-projection
    - .ai-platform/specs/015-multi-series-categorical-comparison/data-model.md#compatibility-matrix
    - .ai-platform/specs/015-multi-series-categorical-comparison/data-model.md#persistence-and-fingerprint
    - .ai-platform/specs/015-multi-series-categorical-comparison/contracts/public-api.md
    - .ai-platform/specs/015-multi-series-categorical-comparison/contracts/validation.md
    - .ai-platform/specs/015-multi-series-categorical-comparison/contracts/editor-api.md#editor-update-matrix
  projection_contract:
    - Validate the complete source, source/view compatibility and narrative invariants before generation dispatch; return no partial data.
    - Expanded groups recursively emit visible descendants; a collapsed group emits one group datum.
    - Category values preserve declared source series order and canonicalize every amount equal to zero to positive zero.
    - Each collapsed group uses one independent Neumaier accumulator per series in narrative leaf order; never calculate a cross-series total.
    - >-
      Any non-finite or unsafe accumulator fails the whole projection at
      /items/{sourceIndex}/values/{seriesIndex}/amount with privacy-safe
      { operation: groupAggregate, sourceIndex, seriesIndex } details.
    - sourceIds contain only category leaf IDs in narrative leaf order, without duplicates or series IDs.
    - Category locked equals its pin state; collapsed-group locked equals presence of a pinned descendant; order is zero-based projection order.
    - >-
      projectCategoricalComparison(SourceData, ViewSpec) is the only new runtime export. A compatible non-v3 pair returns
      SOURCE_CONFLICT / INCOMPATIBLE_PROJECTOR_GENERATION /schemaVersion after compatibility validation.
  state_contract:
    - Commands, selection, pin, annotation, emphasis, grouping, collapse, history and undo/redo remain category/group-only.
    - Source object identity and contents remain immutable; successful undo restores a deep-equal view.
    - >-
      A semantic source or series change creates a new fingerprint/session and clears history and processed IDs while preserving
      only valid selection, without synthesizing command or view events.
    - >-
      A category source-order-only update preserves the valid current narrative order; category ID set or generation changes use
      the approved controlled/uncontrolled/defaultView replacement rules.
    - >-
      A v3 amount or numeric metadata 0/-0-only change is fingerprint-equivalent, does not rebuild the session and still projects
      and formats positive zero.
    - Selection change is emitted exactly once only when the normalized category/group selection actually changes.
  forbidden_changes:
    - Adding any runtime export other than projectCategoricalComparison.
    - Widening the v2 CategoricalDatum, CategoricalProjection or projectCategorical signature/return contract.
    - Changing the public command union wire shape or introducing series/cell commands, selection or history state.
    - Implementing editor/G2 presentation, scene receipt, direct manipulation, host adapters, export, docs, playground examples or package 2.0 work owned by T137-T140.
    - Adding G2, DOM, React or Vue imports to core.
    - Changing dependencies, lockfiles, package manifests, private package versions, the stale editor package assertion, published 1.0 lineage, T131 evidence, workflows, remote Git, tag, publish, release or production configuration.
    - Editing files outside execution_constraints.allowed_files.

