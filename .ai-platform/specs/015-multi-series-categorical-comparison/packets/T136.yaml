    - spec_compliance
    - bug_code_quality
    - qa_acceptance
  review_focus:
    - Projection validation precedence, deterministic DFS order, source-ordered values, positive-zero output and atomic per-series overflow.
    - Category/group-only command, selection, history and update semantics with immutable source and deep-equal undo/redo.
    - Exact v2 projector/datum compatibility, exactly one new runtime export, privacy-safe errors and core import boundary.
    - T135 baseline preservation and absence of editor/G2/package/release or T137 scope leakage.
  acceptance_rule: >-
    T136 may enter Needs_Review only after validation and all review passes. It cannot be marked Accepted without the later
    explicit G003 goal-level user acceptance after T141.

handoff:
  external_issue: null
  pull_request: null
  finish_options:
    - Integrate T136 evidence and review, then make T137 Ready and generate only the T137 packet.
    - Keep the current worktree for the approved serial G003 sequence.
  prohibited_handoff:
    - stage, commit, push, pull request, tag, publish, release or production promotion without separate authorization

stop_conditions:
  - T135 is not Needs_Review, its evidence/review is missing or stale, or its final review gains a Critical/High finding.
  - The pre-edit worktree differs from the recorded governance and reviewed T135 baseline in a file that overlaps T136 ownership.
  - An unrelated user change overlaps an allowed runtime or test file and cannot be preserved without ambiguity.
  - Execution requires a file outside the exact allowed-files list or a broader use than its qualifier.
  - Execution requires changing an approved public, validation, editor, migration, data-model, plan, TDR or work-graph contract.
  - A RED test cannot be made to fail for the expected missing projector, per-series aggregation, invariant or update-matrix reason.
  - Passing T136 requires widening the v2 public datum/projector contract, changing the command wire union or adding series/cell state.
  - Passing T136 requires calculating a cross-series total, mutating source, returning partial overflow data or exposing raw business values in errors/evidence.
  - Passing T136 requires editor/G2/framework, rendering, receipt, direct-manipulation, export, docs, playground-example, local candidate or T137-T141 work.
  - Passing T136 requires changing the T135 editor package baseline exception, any dependency/lockfile/package version, published 1.0 lineage, T131 evidence, workflow, remote Git, tag, publish, release or production configuration.
  - A validation command is unavailable or the retry budget is exhausted.
  - Analysis gains an unresolved Critical or High finding.
