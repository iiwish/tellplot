tdd_plan:
  required: true
  exception: null
  red:
    steps: public projector、per-series aggregation、overflow、zero-sign、commands与update matrix tests。
    command: pnpm exec vitest run packages/core/tests/categorical packages/core/tests/domain/commands.test.ts packages/core/tests/domain/history.test.ts packages/core/tests/domain/property-sequences.test.ts packages/core/tests/editorStore.test.ts
    expected_failure: >-
      Focused tests fail because projectCategoricalComparison, independent per-series aggregation, comparison invariants or
      schema-specific store/session update behavior is missing; failures must not come from a fixture, timeout or environment error.
  green:
    steps: 最小comparison traversal/accumulators与schema-specific store/session branches。
    command: pnpm exec vitest run packages/core/tests/categorical packages/core/tests/domain/commands.test.ts packages/core/tests/domain/history.test.ts packages/core/tests/domain/property-sequences.test.ts packages/core/tests/editorStore.test.ts
    expected_signal: >-
      Comparison projection, per-series atomic aggregation, category-only command/history and update-matrix tests pass while
      source identity stays immutable and the v2 projector contract remains exact.
  refactor:
    steps: 只抽取真实共享tree/sum helpers，不把v2/v3 public datum宽化。
    command: pnpm --filter @tellplot/core test && pnpm --filter @tellplot/core typecheck && pnpm release:architecture
    expected_signal: Core tests, strict types and architecture remain green after only proven shared helper cleanup.

validation_loop:
  commands:
    - pnpm exec vitest run packages/core/tests/categorical packages/core/tests/domain/commands.test.ts packages/core/tests/domain/history.test.ts packages/core/tests/domain/property-sequences.test.ts packages/core/tests/editorStore.test.ts
    - pnpm --filter @tellplot/core test
    - pnpm test:coverage
    - pnpm --filter @tellplot/core typecheck
    - pnpm --filter @tellplot/core build
    - pnpm --filter @tellplot/core test:package
    - node scripts/release/validate-package-surface.mjs
    - pnpm test:package
    - pnpm release:architecture
    - pnpm lint
    - git diff --check
  expected_signals:
    - Every ordinary category and collapsed group contains exactly 2-4 values in current source series order.
    - Per-series aggregation matches independent source sums; any unsafe series fails the complete projection with a privacy-safe source value path.
    - Property sequences prove no lost/duplicate sources, no cross-series total, immutable source identity and deep-equal undo.
    - Wrong-projector dispatch preserves source and compatibility precedence and returns the dedicated generation reason only for a valid compatible pair.
    - Source/category/series updates produce only the approved session, history, selection and callback outcomes.
    - The exact public runtime allowlist adds one function and no editor, G2, package-version, dependency or release surface.
  retry_budget: 2
  failure_policy:
    first_failure: Diagnose and fix only a T136-scoped projector, aggregation, invariant, command, history, session, store, public-export or test issue.
    second_failure: Classify a scope, approved-contract, predecessor-baseline, user-change, toolchain or environment blocker before any further edit.
    beyond_budget: Stop, keep tests truthful and record blocked evidence; never delete tests, weaken assertions, change timeouts or skip a required command.

