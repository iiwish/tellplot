    "packages/tellplot/tests/**": smallest RED/GREEN fixture for the same recorded public-package owner variance only
    "apps/playground/src/**": outside fixtures.ts, conditional T139/T140 workbench or public-journey owner variance only
    "apps/playground/tests/**": smallest RED/GREEN fixture for the same recorded playground owner variance only
    "e2e/comparison-*.spec.ts": outside the primary T141 files, conditional owner regression fixture only; preserve current/previous browser discovery
    e2e/accessibility.spec.ts: conditional T139 accessibility owner variance only
    e2e/container-responsive.spec.ts: conditional T139 responsive/focus owner variance only
    e2e/editorPanels.ts: conditional shared test-helper variance only; no product behavior
    "docs/**": conditional T140 docs/migration owner variance only after a full gate exposes an executable or canonical contract defect
    README.md: conditional T140 public candidate guidance variance only
    CHANGELOG.md: conditional T140 local candidate note variance only; no release date or publication claim
    SUPPORT.md: conditional T140 local candidate support wording variance only; no operational policy expansion
    "packages/*/README.md": conditional owner handoff wording variance only
    scripts/release/audit-candidate.mjs: conditional candidate-only T140 owner variance; preserve exact arguments, actual runtime and path fail-closed behavior
    scripts/release/package-candidate-artifact.mjs: conditional candidate-only T140 owner variance; writes only T141 and never invokes legacy release commands
    scripts/release/rehearse-candidate-source.mjs: conditional candidate-only T140 owner variance; clean frozen rehearsal and T141-only receipt
    scripts/release/canonical-gzip.mjs: conditional reproducibility defect only
    scripts/release/package-contracts.mjs: conditional exact 2.0 candidate surface defect only; no public delta
    scripts/release/package-contracts.json: conditional exact 2.0 candidate expectation defect only; no dependency/export-map change
    scripts/release/release-utils.mjs: conditional candidate utility defect only; no legacy release semantic change
    .prettierignore: T141-A003 Confirmed; append exactly apps/video/out/ and apps/video/public/captures/
  owner_variance_protocol:
    required_steps:
      - Reproduce a blocking full-gate failure on the final T140 baseline and identify the owning predecessor T135-T140.
      - Record command, failure, path, owner task, expected contract and why a primary T141 test-only fix is insufficient before editing source.
      - Add or strengthen the smallest owner-local RED, verify the intended failure, then apply the minimum fix inside the conditional path.
      - Rerun the exact owner suite below plus every T141 gate affected by the change; retain RED/GREEN and any stop/retry history.
      - Include owner-variance paths separately in T141 diff/evidence and obtain all three independent reviews before goal closure.
    owner_suite_map:
      T135: pnpm exec vitest run packages/core/tests/domain/schema-v3.test.ts packages/core/tests/config/comparison-chart-config.test.ts apps/playground/tests
      T136: pnpm exec vitest run packages/core/tests/categorical packages/core/tests/domain/commands.test.ts packages/core/tests/domain/history.test.ts packages/core/tests/domain/property-sequences.test.ts packages/core/tests/editorStore.test.ts
      T137: pnpm exec vitest run packages/editor/tests/export/comparison-chart-spec.test.ts packages/editor/tests/rendering/comparison-group-regions.test.ts packages/editor/tests/export/safe-tooltip.test.ts packages/editor/tests/rendering/g2/chart-runtime.test.ts
      T138: pnpm exec vitest run packages/core/tests/interactions/categoryAxis.test.ts packages/editor/tests/rendering/g2/comparison-scene-receipt.test.ts packages/editor/tests/rendering/g2/chart-pointer.test.ts packages/editor/tests/rendering/g2/chart-runtime.test.ts packages/editor/tests/runtime/chart-surface.test.ts
      T139: pnpm exec vitest run packages/editor/tests/runtime/comparison-editor.test.ts packages/editor/tests/runtime/editor.test.ts packages/react/tests packages/vue/tests
      T140: pnpm exec vitest run packages/editor/tests/export/comparison-export.test.ts apps/playground/tests packages/tellplot/tests packages/editor/tests/package
  read_only_lineage_files:
    - pnpm-lock.yaml
    - .github/workflows/**
    - .ai-platform/evidence/T131/**
    - scripts/release/audit-release.mjs
    - scripts/release/package-artifact.mjs
    - scripts/release/rehearse-source.mjs
    - scripts/release/check-stable.mjs
    - scripts/release/preflight-public.mjs
    - scripts/release/check-package-availability.mjs
  test_targets:
    - 200x2 real comparison keyboard performance with exactly 30 samples and p95 <= 150ms.
    - 200x2 real comparison direct-pointer performance with exactly 30 samples and p95 <= 150ms.
    - Direct preview requestAnimationFrame coalescing with host React root commit delta exactly 0.
    - 50x4 real Canvas/SVG 12-cell responsive matrix across two viewports, two locales and three interaction states.
    - SVGGraphicsElement getBBox/client-bbox pairwise visible-text checks, auto value labels exactly 0 above 40 marks and complete Outline/Tooltip/Inspector paths.
    - Current Chromium/Firefox/WebKit and repository previous-browser matrix including non-performance comparison specs.
    - Full unit/coverage/build/package/framework/a11y/security/architecture and Node-22.20.0 candidate gates.

tdd_plan:
  required: true
  exception: null
  red:
    steps: >-
      Add the comparison 200x2 performance receipts and the new 50x4 responsive matrix before any product change. Run each
      focused target and retain failures caused by missing comparison fixtures, missing direct painted-frame samples, missing
      12-cell geometry receipts or a real contract defect. Existing gates that are already green are regression gates, not
      contrived REDs. If no product change is needed after tests/evidence are complete, record that outcome honestly.
    commands:
      - pnpm exec playwright test e2e/performance.spec.ts --project=chromium-performance
      - pnpm exec playwright test e2e/comparison-responsive.spec.ts --project=chromium
    expected_failure: >-
      New assertions fail only for the absent 200x2 comparison keyboard/direct performance receipt, absent 50x4 responsive
      Canvas/SVG matrix or a reproducible approved-contract defect. Infrastructure, browser-install, stale server, arbitrary
      timeout or predecessor baseline failures are not valid RED evidence.
  green:
    steps: >-
      Complete only the two deterministic fixtures and T141-owned tests/evidence. If a genuine predecessor defect blocks a gate,
      follow owner_variance_protocol before the smallest owner-local implementation fix. Never lower thresholds, skip a matrix
      cell, mock G2 or change browser discovery.
    commands:
      - pnpm exec playwright test e2e/performance.spec.ts --project=chromium-performance
      - pnpm exec playwright test e2e/comparison-responsive.spec.ts --project=chromium
    expected_signal: >-
      Exactly 30 keyboard and 30 direct samples satisfy <=150ms with painted revision/order receipts and zero preview root
      commits; all 12 responsive cells have real Canvas/SVG geometry, label-density and accessible editing receipts.
  refactor:
    steps: >-
      Deduplicate only proven performance/geometry helpers and synthetic fixture generation. Re-run focused targets and any owner
      suite after cleanup, then freeze source before the full matrix and candidate artifact regeneration.
    commands:
      - pnpm exec playwright test e2e/performance.spec.ts --project=chromium-performance
      - pnpm exec playwright test e2e/comparison-responsive.spec.ts e2e/comparison-rendering.spec.ts --project=chromium
    expected_signal: focused results and evidence schema remain unchanged after cleanup

validation_loop:
  runtime: actual Node 22.20.0 matching .nvmrc for every formal command
  runtime_command_prefix: mise x node@22.20.0 --
  commands:
    - pnpm format:check
    - pnpm lint
    - pnpm typecheck
    - pnpm test:coverage
    - pnpm build
    - pnpm test:package
    - pnpm test:framework-matrix
    - pnpm test:e2e
    - pnpm test:a11y
    - pnpm test:performance
    - pnpm test:browser-previous
    - pnpm security:lock
    - pnpm security:dependencies
    - pnpm audit:prod
    - pnpm release:architecture
    - pnpm release:candidate:audit -- --candidate-version 2.0.0 --evidence-task T141
    - pnpm release:candidate:artifact -- --candidate-version 2.0.0 --evidence-task T141
    - pnpm release:candidate:artifact -- --candidate-version 2.0.0 --evidence-task T141
    - pnpm release:candidate:rehearse -- --candidate-version 2.0.0 --evidence-task T141
    - python3 $HOME/.codex/skills/ai-delivery-governor/scripts/validate_delivery_artifacts.py --root . --feature-id 015-multi-series-categorical-comparison
    - git diff --check
  expected_signals:
    - The actual runtime reports v22.20.0 and exactly matches .nvmrc; no environment override is accepted as runtime evidence.
    - Performance evidence contains two groups of exactly 30 samples, the approved p95 formula, both p95 values <=150ms and preview host root commit delta 0.
    - Responsive evidence contains all 12 viewport-locale-state cells with real Canvas, mounted real SVG getBBox and no required overlap/occlusion/overflow.
    - Above 40 visible marks, automatic value-label count is exactly 0 while Outline, Tooltip and Inspector retain complete source-ordered text and category editing.
    - Coverage thresholds, current Chromium/Firefox/WebKit, previous Chromium/Firefox/WebKit/WebKit-18.4, a11y and all package/framework gates pass without narrowing.
    - Dependency lock/security/production audit and architecture gates pass with no dependency, public-surface, network or privacy drift.
    - Two candidate artifact runs have identical filename, size, SHA-256 and file manifest; isolated frozen-source rehearsal passes and writes only T141.
    - T131 evidence, workflows, lockfile and legacy release scripts are byte-for-byte unchanged; no remote or release command is run.
  retry_budget: 2
  failure_policy:
    first_failure: >-
      Preserve output and classify product defect, test/evidence defect, predecessor owner variance, infrastructure or environment.
      Fix only an in-scope T141 test/evidence defect or follow the owner-variance protocol for a reproducible product blocker.
    second_failure: >-
      Re-check approved contracts, worktree baseline, browser/runtime availability, owner task and scope. Do not edit a second
      owner or broaden allowed paths without stopping for a packet amendment and explicit approval.
    beyond_budget: >-
      Stop and record blocked evidence. Do not skip a gate, relax a threshold, increase a timeout, remove a browser/matrix cell,
      overwrite predecessor evidence or report goal closure.

evidence_contract:
  summary: .ai-platform/evidence/T141/summary.md
  test_results: .ai-platform/evidence/T141/test-results.md
  diff: .ai-platform/evidence/T141/diff.patch
  performance_samples: .ai-platform/evidence/T141/performance-samples.json
  responsive_matrix: .ai-platform/evidence/T141/responsive-matrix.md
  review: .ai-platform/evidence/T141/review.md
  tarball_manifest: .ai-platform/evidence/T141/tarball-manifest.json
  candidate_artifact: .ai-platform/evidence/T141/artifacts/tellplot-2.0.0.tgz
  isolated_source_receipt: .ai-platform/evidence/T141/isolated-source-receipt.md
  baseline_product_manifest: .ai-platform/evidence/T141/baseline-product-manifest.json
  predecessor_product_baseline: .ai-platform/evidence/T141/predecessor-product-baseline.patch
  baseline_governance_manifest: .ai-platform/evidence/T141/baseline-governance-manifest.json
  predecessor_evidence_manifest: .ai-platform/evidence/T141/predecessor-evidence-manifest.json
  immutable_lineage_manifest: .ai-platform/evidence/T141/immutable-lineage-manifest.json
  required:
    - T141-A001 Stopped_Pre_Edit record, pre-edit git status and the A002 frozen manifests plus isolated forward/reverse replay separating reviewed T135-T140 changes from T141 delta.
    - RED, GREEN and REFACTOR commands with exit status, expected failure reason, retries, environment and final fresh result.
    - Two 30-sample performance groups, formula, p95, painted revision/order and preview RAF/root-commit receipts without business values.
    - Twelve responsive cells with viewport, locale, state, Canvas receipt, mounted SVG getBBox receipt, layout rectangles and screenshot references.
    - Exact value-label count 0 above 40 marks plus complete Outline, Tooltip and Inspector read/edit receipts.
    - Full current and previous browser, a11y, coverage, build, package, framework, security, production-audit and architecture command results.
    - Concrete v1/v2 compatibility and v3 public package/migration consumer results retained from fresh full gates.
    - Actual Node 22.20.0, exact candidate arguments, two-run reproducible tarball manifest/hash and isolated frozen-source rehearsal.
    - Byte/hash immutability receipt for T131 evidence, workflows, pnpm-lock.yaml and accepted legacy release scripts.
    - Owner variance record with owning task, RED/GREEN, changed paths and owner-suite rerun, or an explicit statement that no variance occurred.
    - Task-local replayable diff containing only T141 delta and matching the final owned tree byte-for-byte.
    - Explicit confirmation that no dependency, public contract, remote Git, preflight, availability, tag, publish, release or production action changed or ran.
    - Spec-compliance, bug/code-quality and QA-acceptance reviews with counts and residual Low risks/owners.

review_contract:
  required_passes:
    - spec_compliance
    - bug_code_quality
    - qa_acceptance
  review_focus:
    - Exact 200x2 sample count, commit-to-matching-painted-frame boundary, p95 formula/budget and zero React root commits during direct preview.
    - Complete 50x4 viewport-locale-state matrix with real Canvas/SVG geometry, visible text, density policy and accessible fallback paths.
    - Current/previous browser discovery, full test/coverage/a11y/package/framework/security/architecture results and absence of skipped or weakened gates.
    - Any owner variance is tied to a reproducible blocking defect, minimally fixed and covered by the exact predecessor owner suite.
    - Candidate T141-only writes, actual pinned Node, reproducibility, isolated-source rehearsal and immutable published 1.0 lineage.
    - No dependency, public API/schema/export, remote, publish, release, production or user-work overwrite.
  acceptance_rule: >-
    T141 and G003 may enter Needs_Review only after every required validation passes and all three independent reviews report no
    unresolved Critical/High/Medium finding. Low findings remain explicit with owner and residual risk. T135-T141 and G003 are
    not Accepted until the user explicitly accepts the goal-level reviewed result.

handoff:
  external_issue: null
  pull_request: null
  finish_options:
    - Keep the shared worktree for user goal-level review after T141 and G003 enter Needs_Review.
    - Prepare a separate Git/release handoff only after explicit user acceptance and separate remote/release authorization.
  prohibited_handoff:
    - stage
    - commit
    - push
    - pull request
    - tag
    - npm publish
    - GitHub Release
    - public preflight or availability
    - production promotion

stop_conditions:
  - A confirmed constitution, product/spec, checklist, TDR/plan/work graph, analysis, predecessor packet/evidence/review or this packet is missing or stale.
  - T140 is not Needs_Review or any T135-T140 review has an unresolved Critical, High or Medium finding.
  - The current tree differs from the A002 frozen product/governance manifests, the cumulative patch does not replay from the exact base commit, any replayed path hash differs, predecessor evidence hashes change or an unrelated change overlaps T141 ownership.
  - A RED fails for infrastructure, missing browser/runtime, stale server, arbitrary timeout or a predecessor exception rather than the intended T141 assertion.
  - Performance requires fewer than 30 samples, a budget above 150ms, a different p95 formula, DOM-only timing, mocked paint or an environment override.
  - Responsive acceptance requires fewer than 12 cells, mock/single-series/empty output, fixed guessed geometry, hidden overlap or omission of idle/hover/active-drag.
  - Passing requires skipping, renaming out of discovery, narrowing browsers, increasing timeouts, lowering coverage/a11y/security assertions or ignoring a failed gate.
  - A source/test/doc change is needed without a reproducible blocking defect, recorded predecessor owner and exact owner-suite rerun.
  - More than one predecessor ownership boundary must change, or a fix requires a public contract, architecture, dependency or work-graph amendment.
  - Passing requires editing pnpm-lock.yaml, T131 evidence, a workflow, an accepted legacy release script, package export map, private package version or publishConfig.
  - Candidate tooling accepts a version other than 2.0.0, a task other than T141, a runtime other than actual Node 22.20.0 or any path/symlink escape.
  - Candidate output would write outside .ai-platform/evidence/T141 or overwrite T140/predecessor evidence.
  - Any business amount, category label, series label, sourceRef, metadata value or sensitive absolute path would enter evidence.
  - T141-A003 exact paths or boundaries must expand beyond the user-confirmed amendment.
  - Execution requires public preflight, availability, trust-readiness, stage, commit, push, PR, tag, publish, release, remote or production commands.
  - A validation command is unavailable, retry budget is exhausted or an independent review reports unresolved Critical/High/Medium.
