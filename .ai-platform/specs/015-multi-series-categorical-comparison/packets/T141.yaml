codebase_context:
  local_instructions:
    - AGENTS.md
  relevant_files:
    - e2e/performance.spec.ts
    - e2e/performanceBudget.ts
    - e2e/comparison-responsive.spec.ts
    - e2e/comparison-rendering.spec.ts
    - e2e/comparison-interaction.spec.ts
