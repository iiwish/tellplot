    - packages/editor/tests/react-matrix/run-react-matrix.mjs
    - scripts/release/audit-candidate.mjs
    - scripts/release/package-candidate-artifact.mjs
    - scripts/release/rehearse-candidate-source.mjs
    - scripts/release/package-contracts.json
    - package.json
    - .nvmrc
  existing_patterns:
    - >-
      e2e/performance.spec.ts already owns a real React root commit probe, painted Canvas signature receipt, exact
      sorted[ceil(.95*n)-1] p95 calculation and 30-sample loops for existing chart generations. Extend those mechanisms for
      schema-3 comparison rather than adding wall-clock sleeps, mocked paint, a second performance threshold or framework-private
      instrumentation.
    - >-
      T137-T140 establish one canonical G2 comparison spec shared by screen and fresh offscreen SVG/PNG. Responsive evidence must
      use the real screen Canvas and the public SVG export mounted into the browser DOM; component-data assertions or a mocked
      renderer are not substitutes for visible geometry.
    - >-
      The repository current-browser gate is pnpm test:e2e for Chromium, Firefox and WebKit. The previous-browser runner copies
      every root E2E spec except files ending performance.spec.ts, so comparison responsive/rendering acceptance must remain in a
      non-performance filename and must not be excluded or renamed out of the previous matrix.
    - >-
      T139 owns the complete imperative DOM, React 18, React 19 and Vue 3 host matrix and accessibility semantics. T140 owns exact
      tellplot@2.0.0 public surface, export/docs/migration and candidate-only path/runtime hardening. T141 consumes and replays
      those contracts; it does not create a second implementation owner.
    - >-
      Candidate artifact and rehearsal already compare the actual process.versions.node with .nvmrc and fail closed for evidence
      ancestors, roots, nested outputs and output leaves. T141 runs all three candidate commands under actual Node 22.20.0 and
      writes only .ai-platform/evidence/T141.
  interfaces_or_contracts:
    - .ai-platform/specs/015-multi-series-categorical-comparison/spec.md#msc-nfr-002-性能
    - .ai-platform/specs/015-multi-series-categorical-comparison/spec.md#msc-nfr-004-可访问性
    - .ai-platform/specs/015-multi-series-categorical-comparison/spec.md#msc-nfr-006-兼容与依赖
    - .ai-platform/specs/015-multi-series-categorical-comparison/spec.md#msc-nfr-007-发布边界
    - .ai-platform/specs/015-multi-series-categorical-comparison/plan.md#performance-and-visual-matrix
    - .ai-platform/specs/015-multi-series-categorical-comparison/plan.md#final-gates
    - .ai-platform/specs/015-multi-series-categorical-comparison/tasks.md#t141---完成性能完整矩阵与目标级-evidence
  performance_contract:
    - >-
      Use one deterministic 200-category x 2-series comparison fixture at viewport 1440x900. Wait for the initial G2 animation
      and one warm-up before collecting samples. Do not lower or override the product budget through an environment variable in
      authoritative evidence.
    - >-
      Collect exactly 30 alternating keyboard reorder samples and exactly 30 alternating direct-pointer reorder samples. Each
      sample begins at accepted command commit and ends at the first painted Canvas frame whose editor revision and authoritative
      category order both equal the expected values. A DOM-only revision or timer completion is insufficient.
    - >-
      For each group sort ascending and compute p95 as sorted[ceil(0.95*n)-1]. Both keyboard and direct-pointer p95 must be at
      most 150ms. Preserve all 60 raw timing samples, formula, environment, expected/painted revision-order receipts and computed
      p95 in performance-samples.json without category labels, series labels, amounts, sourceRef or metadata values.
    - >-
      During an active direct preview, prove requestAnimationFrame coalescing and a host React root commit delta of exactly zero.
      A committed command may follow existing controlled-host semantics; the zero-commit assertion applies to the preview path
      defined by MSC-NFR-002 and cannot be replaced by a pointer-event count alone.
  responsive_contract:
    - >-
      Use one deterministic 50-category x 4-series comparison fixture with maximum 12-character CJK and 24-character Latin
      labels. Cover 1280x720 and 640x480, zh-CN and en-US, and idle, hover and active-drag states: 12 explicit matrix cells.
    - >-
      Every cell must render a nonblank real G2 Canvas and record viewport, locale and interaction state. Assert no unexpected
      page horizontal overflow; plot, legend and toolbar layout rectangles do not intersect; group action and drag indicator may
      overlay the plot but do not occlude the current target, legend, toolbar or required text.
    - >-
      For the same cell configuration, export through the public SVG path, mount the real SVG in the page and use SVGGraphicsElement
      getBBox plus visible client rectangles for pairwise visible-text intersection. Transient hover/drag overlays remain screen-only
      by contract; the matrix must record that separation rather than fabricating transient SVG marks.
    - >-
      With 200 visible marks, assert automatic value labels are exactly zero. Nevertheless select categories through Outline,
      read full source-ordered values through Tooltip and Inspector, and perform a complete category/group edit through the
      existing category-only surface in every viewport/locale family. Truncated or hidden chart text cannot remove those paths.
  full_quality_contract:
    - >-
      Run fresh format, lint, strict type, coverage, build, core/editor/React/Vue/playground/package, framework, full current
      browser, previous browser, accessibility, performance, dependency lock, dependency security, production audit and
      architecture gates. Preserve existing thresholds, projects, retries, timeouts and assertions.
    - >-
      Current and previous browser evidence must include the new non-performance comparison responsive/rendering specs. Full
      compatibility must retain concrete v1 waterfall, v2 waterfall and v2 scalar categorical wire/runtime/persistence/visual/
      export paths plus v3 strict consumers and migration fixtures.
    - >-
      No test may be skipped, narrowed, renamed out of discovery, replaced with a mock or made green by increasing the 150ms
      product budget. Environment or infrastructure failures must be classified and preserved rather than treated as product pass.
  candidate_and_release_contract:
    - >-
      Execute candidate audit, artifact and rehearsal with actual Node 22.20.0 matching .nvmrc, exact --candidate-version 2.0.0
      and exact --evidence-task T141. Artifact, manifest, hash and isolated-source receipt may be written only under
      .ai-platform/evidence/T141; T140 evidence is a read-only predecessor.
    - >-
      Candidate artifact must be reproducible across two consecutive canonical builds with identical filename, size, sha256 and
      file manifest. Rehearsal uses a clean source copy, frozen install, build, package gates and candidate audit without copying
      existing evidence or exposing temporary absolute paths.
    - >-
      T131 evidence, publish workflows, pnpm-lock.yaml and accepted 1.0 release scripts remain byte-for-byte unchanged. Do not run
      public preflight, availability, trust-readiness, stage, commit, push, pull request, tag, publish, GitHub Release or production
      promotion commands.
  forbidden_changes:
    - Changing the approved public API/schema/migration, package export map, private package versions, publishConfig or dependency graph.
    - Adding a comparison-only public option, result, error, handle, framework prop/event or G2/spec/receipt/geometry/migration export.
    - Changing the 150ms budget, sample count, p95 formula, browser projects, coverage thresholds, a11y rules or previous-browser discovery to obtain a pass.
    - Using mocked G2 output, DOM-only timing, fixed chart geometry or component-data assertions as real Canvas/SVG evidence.
    - Recording business amounts, category labels, series labels, sourceRef or metadata values in performance, responsive, log or review evidence.
    - Editing T131 evidence, workflows, pnpm-lock.yaml or accepted legacy release scripts.
    - Running public preflight, availability, trust-readiness, remote Git, tag, publish, release or production commands.
    - Editing a predecessor-owned source/test/doc without the owner-variance protocol and exact owner-suite rerun.
    - Editing a file outside execution_constraints.allowed_files or beyond its qualifier.

