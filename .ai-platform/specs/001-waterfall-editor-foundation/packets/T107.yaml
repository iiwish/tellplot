    - "pnpm build"
    - "pnpm test:package"
    - "pnpm exec playwright test e2e/export.spec.ts e2e/accessibility.spec.ts --project=chromium"
    - "git diff --check"
    - "python3 /Users/iiwish/.codex/skills/ai-delivery-governor/scripts/validate_delivery_artifacts.py --root . --feature-id 001-waterfall-editor-foundation --task-id T107"
  expected_signals:
    - "RED fails for missing persistence/export/handle/summary behavior rather than syntax or harness errors."
    - "Round-trip preserves every ViewSpec field byte-for-byte after normalization; conflict fixtures return stable code/path and leave the editor unchanged."
    - "Real Chromium PNG has requested dimensions and non-background pixels; SVG is nonempty, parseable, ordered, readable and free of prohibited content."
    - "Real Chromium SVG exposes the imported highlight stroke and muted opacity; nested JSON/SVG preserve the recursive tree while exporting only visible descendants."
    - "Axe reports zero serious/critical violations for ready, export progress/result/error, JSON import error and mobile file controls."
    - "All unit/coverage/type/lint/format/build/package and selected real-browser commands exit 0 after GREEN."
  retry_budget: 3
  failure_policy: "Fix only T107 persistence/export/handle/accessibility/playground defects. Stop if G2 cannot produce safe matching SVG without a second renderer or if domain command semantics must change."

