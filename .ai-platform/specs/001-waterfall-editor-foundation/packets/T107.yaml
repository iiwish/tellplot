    - "packages/editor/src/components/EditorToolbar.tsx"
    - "packages/editor/src/components/WaterfallCanvas.tsx"
    - "packages/editor/src/components/AccessibleChartSummary.tsx"
    - "packages/editor/src/components/editorMessages.ts"
    - "packages/editor/src/react/editorTypes.ts"
    - "packages/editor/src/styles/**"
    - "packages/editor/src/index.ts"
    - "packages/editor/tests/domain/persistence.test.ts"
    - "packages/editor/tests/components/accessibility.test.tsx"
    - "packages/editor/tests/export/**"
    - "packages/editor/tests/package/**"
    - "apps/playground/package.json"
    - "apps/playground/src/**"
    - "e2e/export.spec.ts"
    - "e2e/accessibility.spec.ts"
  dependency_changes:
    - "@antv/g-svg 2.1.1 is the exact dependency used by the real-browser G2 SVG prototype and is retained only if output fidelity and cleanup pass."
    - "The playground may declare the already-approved lucide-react 1.24.0 icon package directly instead of relying on a transitive editor dependency."
    - "No raster/SVG conversion library, animation library, global store, file saver or second charting library may be added."
  allowed_scope_correction: "T107 public handle types belong with existing public React types in packages/editor/src/react/editorTypes.ts, localized export status belongs in editorMessages.ts, and package consumer tests must lock the new surface. These files are added to the canonical allowed scope without changing product behavior."
  forbidden_changes:
    - "No SourceData mutation, migration engine, autosave, localStorage, backend, network, AI, routing, PowerPoint generation or new chart type."
    - "No handwritten SVG waterfall renderer, Canvas geometry inference or duplicate chart-spec theme."
    - "No public G2 instance, projection, controller or dispatch escape hatch."
    - "No commit, push, PR, merge, publish or remote mutation."
  worktree_ownership: "T101-T106 and T106-CR001 accepted reset work remains in the existing codex/reset worktree. T107 edits stay within its approved implementation and governance/evidence paths and preserve accepted recursive interaction behavior."
  conflicts:
    - "T108 must not execute concurrently because it owns the same E2E, package and playground surfaces."

tdd_plan:
  red:
    - "Add persistence tests for deterministic round-trip, malformed JSON, unsupported major version, dataset mismatch, missing or unresolved source IDs, immutability and non-plain data."
    - "Add export option/error/blob tests before export modules and public handle exist."
    - "Add component tests for current-view handle, invalid/unmounted export, focus, ordered summary, collapsed/expanded summary and live export status."
    - "Add real Chromium tests for nonempty PNG pixels, inspectable SVG order/text/safety, current reordered/collapsed state, explicit download and invalid JSON no-change."
    - "After T106-CR001, add RED regressions for missing emphasis styling and image export during a live reorder preview; add recursive summary and nested JSON/SVG compatibility proof."
  green:
    - "Implement pure persistence, shared G2 chart spec, PNG Canvas export, offscreen G2 SVG export, structured errors and exact cleanup."
    - "Implement forwardRef handle, dedicated AccessibleChartSummary and keyboard-reachable export/file controls."
    - "Implement controlled playground ViewSpec and public-only import/export/download workflow."
    - "Pass emphasis through the shared screen/SVG chart spec and reject image export from the real chart-stage interaction state before selecting PNG or SVG."
  refactor:
    - "Separate option validation, filename policy, Canvas/SVG adapters and component orchestration; keep shared visual spec single-source."
    - "Inspect desktop/mobile export states and correct focus, overflow, progress, contrast and text-fit defects without adding decoration."

