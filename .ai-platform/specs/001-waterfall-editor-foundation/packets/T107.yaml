codebase_context:
  branch: "codex/reset"
  current_state: "T106-CR001 and T107 are Accepted. The editor uses one recursive ViewSpec forest, one projectWaterfall path, one persistent G2 Canvas chart and one shared G2 chart spec for screen and export. T107 persistence, file workflow and accessibility behavior are accepted, and T108 is unlocked."
  architectural_boundary:
    - "serializeViewSpec and parseViewSpec are pure domain functions; parse delegates semantic truth to validateViewSpec and never reconciles or rewrites missing source references."
    - "On-screen Canvas, PNG and SVG consume the same T104 projection and one shared G2 chart-spec builder; no handwritten second chart renderer or waterfall arithmetic is permitted."
    - "FinancialChartEditorHandle exposes focus, exportImage and getViewSpec only; it does not expose dispatch, controller state, projection or G2 Chart."
    - "The package export API returns a Blob and metadata or throws a structured privacy-safe export error; it never creates a download link or performs network access."
    - "The playground owns explicit download links, JSON file import/export and object URL cleanup; it imports only the public package entry."

locked_behavior:
  persistence:
    - "serializeViewSpec emits deterministic JSON for the current schema without mutating input or including SourceData values."
    - "parseViewSpec accepts JSON text plus SourceData, rejects malformed/non-object input, unsupported major schema, dataset mismatch and missing or unresolved source references with existing stable ValidationIssue codes and paths."
    - "A successful parse returns the validated plain ViewSpec with order, groups, collapse, pin, annotations, emphasis and revision preserved; it does not silently migrate or reconcile."
  export:
    - "ExportOptions supports svg/png, optional filename/background and PNG pixelRatio 1..4 with default 2; invalid options reject before render."
    - "PNG uses the mounted real G2 canvas and produces a nonempty Blob at requested pixel density; SVG uses a supported offscreen G2 SVG renderer with the same projection/spec and cleans up chart, DOM and object resources on success or failure."
    - "SVG contains no script, foreignObject, external URL, SourceData metadata, sourceRef or hidden financial payload; visible labels and current visible node order remain inspectable."
    - "ViewSpec emphasis is rendered by the shared chart spec: highlight uses full opacity with a 3px #18211D stroke, muted uses 0.28 opacity, and SVG/PNG follow the same screen semantics."
    - "Image export rejects with EXPORT_UNAVAILABLE /export while chart or outline live reorder preview is active, before the PNG/SVG branch, so formats cannot capture different orders."
    - "ExportResult contains blob, exact MIME type, safe suggested filename, width and height; methods never auto-download."
    - "Export failure rejects a structured code/path error without labels, amounts, sourceRef, caller exception text or console leakage."
  handle_and_accessibility:
    - "focus moves focus to the editor root or its first meaningful control; getViewSpec returns the current visible ViewSpec and never stale initial props."
    - "exportImage is unavailable for invalid/unmounted/no-canvas/live-preview state with a structured error and otherwise uses the current stable canonical visible projection."
    - "AccessibleChartSummary is a dedicated text equivalent with title, visible count, ordered labels, kind and formatted amount; collapsed groups summarize only the visible aggregate and expanded groups expose children."
    - "Recursive summary and export consume only the current visible projection: inner collapse, outer collapse and full expansion preserve order without exposing hidden descendants."
    - "Export progress/result/error and JSON import result use visible status plus a polite live region; focus remains visible and menus/file controls are keyboard reachable."
  playground:
    - "The reference editor provides ViewSpec JSON export/import and SVG/PNG actions using the public API only, without a second reducer or private package imports."
    - "Import requires explicit file selection and applies only a successful parse; invalid files leave the current ViewSpec unchanged and show code/path only."
    - "Download URLs are created only after an explicit user action and revoked after use or component cleanup."

