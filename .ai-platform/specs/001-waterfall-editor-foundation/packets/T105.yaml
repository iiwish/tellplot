work_unit:
  title: "实现 React 工作台与真实 G2 渲染"
  goal: "交付可嵌入的 FinancialChartEditor、controlled/uncontrolled controller、真实 G2 waterfall canvas 与真实财务 playground。"
  requirement_mapping:
    - "WF-US-001"
    - "WF-US-005"
    - "WF-FR-010"
    - "WF-FR-014"
    - "WF-NFR-004"
    - "WF-NFR-005"
  dependencies:
    - "T101 Accepted"
