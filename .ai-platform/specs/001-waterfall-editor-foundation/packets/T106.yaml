  required_files:
    - "summary.md"
    - "test-results.md"
    - "diff.patch"
    - "hit-target-fix.patch"
    - "screenshots/desktop-drag-target.png"
    - "screenshots/collapsed-group.png"
    - "screenshots/mobile-group-actions.png"
    - "screenshots/reduced-motion.png"
  required_content:
    - "RED/GREEN/REFACTOR commands with exit status and expected failure signal."
    - "Chart/outline/keyboard parity snapshots, cancel identity/revision evidence and fixed-item rejection."
    - "Group create/collapse/expand/ungroup projection evidence with amount/source conservation."
    - "Axe result, performance samples/p95, listener cleanup, changed files, diff summary and residual risks."

review_contract:
  spec_compliance:
    - "Every T106 requirement and locked behavior has direct component or real-browser evidence."
    - "All state changes use executeCommand; domain/projection/public API/T107 boundaries remain unchanged."
    - "Changed files stay within the corrected canonical allowed scope."
  engineering_quality:
    - "Strict types, no any/ignore, input immutability, listener/pointer-capture/chart cleanup and privacy-safe failures."
    - "No per-frame React state for chart pointer motion; semantic target updates are bounded."
    - "dnd-kit and axe are exact, justified dependencies; package runtime remains consumable."
    - "Projection commits update one live G2 instance rather than paying destroy/import/create on each command."
  visual_quality:
    - "Drop target and selection are legible without covering data; row dimensions and workbench hierarchy stay stable."
    - "Desktop, compact and mobile surfaces have no overlap/overflow; reduced-motion retains full state clarity."
    - "Standard operational design review average >=1.7 with no zero in core dimensions."
  qa_acceptance:
    - "Independent spec, engineering and visual/QA reviews have no remaining Critical/High/Medium finding."
    - "T106 ends Needs_Review and awaits explicit user acceptance before T107."

handoff:
  on_success: "Attach evidence, mark T106 Needs_Review, keep T107-T108 Draft, run a local acceptance server and show interaction-focused URL/screenshots."
  on_failure: "Keep T106 Running with an explicit blocker and failed evidence; do not advance T107."
  remote_actions: "None authorized."

stop_conditions:
  - "Equivalent chart/outline/keyboard move cannot use the existing moveItem contract."
  - "Real G2 element events cannot provide semantic datum identity and bounds without exposing or guessing chart internals."
  - "T106 requires a domain/public API semantic change, nested groups, persistence or export implementation."
  - "200-item or axe gates can pass only by weakening the approved assertions or hiding required UI."
