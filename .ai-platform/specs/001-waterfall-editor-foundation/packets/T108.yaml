    - "screenshots/mobile-final.png"
    - "screenshots/annotation-workflow.png"
    - "quickstart-receipt.md"
    - "performance-samples.json"
  required_content:
    - "T107 acceptance receipt, packet validation and RED/GREEN/REFACTOR trail."
    - "Exact command, exit code, count, browser engine, React version, coverage and performance results."
    - "Quickstart walkthrough and screenshot inspection at all three target viewports."
    - "Changed files, diff summary, CI/package evidence, independent reviews and residual risks."

review_contract:
  spec_compliance:
    - "Map every WF-SC and WF-NFR acceptance condition to direct evidence without relying on claims from earlier tasks."
    - "Confirm the quickstart uses public editor workflows and all accepted recursive, export and accessibility contracts remain intact."
  engineering_quality:
    - "Review isolated consumer integrity, exact peer versions, process cleanup, deterministic ports/temp cleanup, CI reproducibility, strict typing and absence of weakened gates."
    - "Review full diff for scope drift and confirm no accepted implementation source changed without a RED regression and recorded fix scope."
  visual_quality:
    - "Inspect original desktop, compact and mobile screenshots for nonblank G2 output, hierarchy, readable labels, stable control dimensions, focus affordances, overflow and overlap."
    - "The operational editor remains dense, restrained and task-focused rather than becoming a decorative landing surface."
  qa_acceptance:
    - "Independent spec, engineering and visual/QA reviews have no unresolved Critical or High finding; all Medium findings are fixed or explicitly accepted by the user."
    - "T108 enters Needs_Review and waits for explicit user acceptance."

stop_conditions:
  - "A full validation exposes loss, duplication or mutation of a financial contribution or SourceData."
  - "React 18.3 or React 19.2 requires changing the approved public API or bundling React/G2 into the editor package."
  - "Firefox or WebKit cannot be installed or launched after the retry budget."
  - "A required GREEN can only be achieved by weakening assertions, accessibility or performance gates."
  - "A Critical or High spec, engineering, package, browser or visual finding remains unresolved."

handoff:
  task_status: "Accepted"
  acceptance_receipt: "User explicitly accepted T108 on 2026-07-18."
  next_gate: "T101-T108 are complete; any release, publish or remote delivery action requires separate authorization."
