validation_loop:
  focused_red:
    - Run stable package identity, required public files and release-script tests before implementation.
    - Record the expected beta version and missing-file/script failures.
  focused_green:
    - Run the same focused suite after stable metadata, public docs and release scripts are present.
  regression:
    - Run release:check, isolated rehearsal and the complete current/previous compatibility matrix.
  failure_policy:
    - Fix T123 failures only within allowed files.
    - Stop if a fix requires dependency, schema, runtime behavior or a remote action.

