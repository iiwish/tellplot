tdd_plan:
  red:
    - Require Inspector to hide create-group validation for single item/group selections.
    - Require inside resolution and cross-container chart/outline targets.
    - Require a two-child source group to dissolve atomically and undo/redo exactly.
    - Require deterministic expanded regions and bounded groupRegion appearance.
    - Require value-bounded range backgrounds, first-member label anchors and independent foreground group/value
      text marks in waterfall/column/bar shared screen/export specs.
  green:
    - Implement the minimum contextual UI, resolver, executor, region projection and appearance/spec mapping.
  refactor:
    - Extract only the region projection/spec helpers consumed by all current chart families.

