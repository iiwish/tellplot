validation_loop:
  focused_red:
    - Run the relevant component, interaction, domain and chart-spec tests and record expected failures.
  focused_green:
    - Run the same focused suites after each minimal implementation slice.
  regression:
    - Run the complete validation command matrix without weakening thresholds or browser budgets.
  failure_policy:
    - Fix failures caused by T118 within the allowed files.
    - Stop if a fix requires dependency, schema, breaking API, new chart family or remote action.

